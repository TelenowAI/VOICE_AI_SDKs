[package]
name = "telenow-audio-core"
version = "0.1.1"
edition = "2021"
description = "Real-time voice DSP for the Telenow voice AI SDK — G.711 μ-law codec, linear resampler, RFC 3550-style adaptive jitter buffer, RMS metering. Pure std, no unsafe, no dependencies."
license = "MIT"
homepage = "https://telenow.ai"
documentation = "https://telenow.ai/docs/sdk-overview"
repository = "https://github.com/MettyAI/VOICE_AI_SDKs"
readme = "README.md"
keywords = ["audio", "dsp", "jitter-buffer", "voip", "g711"]
categories = ["multimedia::audio", "network-programming"]

[lib]
# rlib for fast, dependency-free `cargo test`. For platform builds, add:
#   • "cdylib" + wasm-bindgen → WASM (web)            (wasm-pack)
#   • "cdylib" + jni           → Android (.so via JNI)
#   • "staticlib"/"cdylib"     → iOS (C-FFI via uniffi/cbindgen)
crate-type = ["rlib"]

[dependencies]

# Standalone workspace root so `cargo test` here is fully isolated from the
# backend crate a teammate is editing.
[workspace]
