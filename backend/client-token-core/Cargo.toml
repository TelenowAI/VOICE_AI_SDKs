[package]
name = "telenow-client-token"
version = "0.1.0"
edition = "2021"
description = "Telenow ephemeral client-token claims + mint/verify (HS256). Short-lived, scoped tokens that let a browser/app start ONE call without ever holding the org API key. Stateless verification — scales without a DB/Redis hit on the hot path."
license = "MIT"

[dependencies]
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone workspace root — isolated from the live backend crate.
[workspace]
