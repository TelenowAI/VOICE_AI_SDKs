openapi: 3.0.3
info:
  title: Telenow Voice API
  version: 1.1.0
  description: >
    Control-plane API for the Telenow Voice SDK. Generate backend clients in any
    language from this spec (see README). Audio is carried over a separate
    WebSocket (`/ws/web-agent`), not described here.


    Every operation here is a stable surface: removing one, renaming a field, or making an
    optional request field required is a breaking change and comes with a new major version.
    The backend's tests hold this document to the routes: every operation is served, and
    every route an org API key reaches is described here or listed, with its reason, in
    `src/features/api_surface/undocumented.tsv`.


    1.0.0 is the first released version. `openapi/released/openapi.yaml` holds the version last
    released, and the backend's tests fail on any change that would break a client written
    against it, unless the change is accepted (with its reason) in
    `openapi/released/accepted_breaks.tsv` and the major version is raised.
servers:
  - url: https://api.telenow.ai
    description: Production
  - url: http://localhost:3005
    description: Local dev

security:
  - ApiKeyAuth: []

paths:
  /api/client-tokens:
    post:
      operationId: createClientToken
      summary: Mint a short-lived, scoped client token for a browser/app.
      description: >
        Called by your backend; the token starts calls with exactly this agent and these variables, and expires.
        Redeem it at `POST /api/sessions/init-web-call` with `Authorization: Bearer <token>`. A viewer key gets 403
        (minting is a write), and so does an agent of another organization; an unknown agent is 404. A body that
        is not JSON is 400 and one missing `agentId` (or with a mistyped field) is 422, both plain text.
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientTokenRequest' }
      responses:
        '200':
          description: Token minted. Flat — no `success` / `data` wrapper.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientToken' } } }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/sessions/initiate-call:
    post:
      operationId: initiateCall
      summary: Place an outbound PSTN call.
      description: >
        The agent must be yours (another organization's is 403, an unknown one 404). The number is
        checked against your do-not-call list and consent rules first (403). The caller id is
        `fromNumber`/`fromNumberId` (not both, 400) or the agent's own number — an agent with
        neither is 400. Then the account must be able to spend (403 when suspended or out of
        credit, 429 at a concurrency cap — only on the synchronous path: `queue: true` answers 202
        instead). A carrier that refuses the dial is 400 or 502. A draining server is 409 (retry).
        The queue is per agent AND dial policy (caller id, machine detection, attempts, backoff,
        retry on no answer): the same number queued again with the same policy is `deduplicated`;
        with another policy it joins another queue.
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiateCallRequest' }
      responses:
        '201':
          description: Call started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/CallResult' } }
        '202':
          description: >
            Queued (`queue: true` only). No live session yet — the worker dials
            later, so there is no `sessionId` to poll.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuedCallResult' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/sessions/{id}/context:
    post:
      operationId: addContextNote
      summary: Tell the agent something mid-call, without it being a caller turn.
      description: >
        A live context note, for any live call (phone, SIP, web) by session id. The agent
        sees it from its next reply; it is never counted as something the caller said and
        moves nothing in a flow. A later note with the same `key` replaces this one (a note from
        the caller's own app never replaces yours: its keys are its own). An identical retry of a
        note the agent already had in view is not told to the caller twice. A call held by
        another server is forwarded there.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: 'Payment of ₹4,500 received. UPI ref 41234.' }
                key: { type: string, example: payment }
                respond: { type: string, enum: [none, when_idle], default: none }
      responses:
        '202':
          description: >
            Taken. `delivery` says when the agent sees it: `next_turn` (from its next reply),
            `held` (the agent is away — the caller put it on hold, or a transfer is under way that
            may give the call back — and sees it when it gets the call back), `speaking_now`
            (`respond: when_idle` into a free line).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [noteId, key, delivery]
                    properties:
                      noteId: { type: string, format: uuid }
                      key: { type: string, nullable: true }
                      delivery: { type: string, enum: [next_turn, held, speaking_now] }
        '400':
          description: '`empty` (no text), `invalid_respond` (neither `none` nor `when_idle`), or a body that is not the JSON above.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: No such call in your organization (another organization's call answers the same).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
        '409':
          description: '`not_live` (the call has ended, or has not started), `no_agent` (a person has the call for good — a manual call, a takeover, a transfer that went through) or `engine_unsupported` (a Custom API agent, or a Gemini Live model other than 3.8 Live and 3.1 Flash Live).'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
        '413':
          description: '`too_large` — the body carries `maxChars`, how many of this note''s characters (Unicode code points) fit right now, beside the notes the call already holds. The room is the agent model''s own context, so it differs by model.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
        '429':
          description: Over the API's rate limit.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
        '503':
          description: '`owner_unknown` (the call''s server has not registered it yet) or `owner_unreachable` (it did not answer in time). Retry after `Retry-After` seconds.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }

  /api/sessions/{id}/activity:
    post:
      operationId: noteUserActivity
      summary: The caller is still here, just busy — restart the agent's silence check-in.
      description: >
        Restarts the agent's silence check-in — or, in a wait the caller asked for ("give me a
        minute"), that wait's nudges and its close — so the agent does not ask "are you still
        there?" while the caller is busy (paying, reading, typing). Never makes the agent speak.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: '`nextCheckinInMs`: how long until the agent would speak up unprompted — ping again before it runs out while the caller stays busy — or null when nothing is armed right now (a hold, a wait still being acknowledged, a speech-to-speech agent): try again once the conversation moves on.'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [nextCheckinInMs]
                    properties:
                      nextCheckinInMs: { type: integer, nullable: true }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: No such call in your organization.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
        '409':
          description: '`not_live` (ended or not started) or `no_agent`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
        '429':
          description: Over the API's rate limit.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
        '503':
          description: '`owner_unknown` or `owner_unreachable` — retry after `Retry-After` seconds.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }

  /api/sessions/{id}/transfer:
    post:
      operationId: transferCall
      summary: Warm-transfer a live call to a phone number.
      description: >
        The call must be live (ended is 400); `to` is checked against your do-not-call list and
        consent rules (403). A transfer the call cannot make (not live on this server, a call type
        that cannot transfer, a carrier refusal) is 502.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties: { to: { type: string, example: '+15551234567' } }
      responses:
        '200':
          description: Transferred
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [sessionId, to, status]
                    properties:
                      sessionId: { type: string, format: uuid }
                      to: { type: string }
                      status: { type: string, example: transferred }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '502': { $ref: '#/components/responses/Error' }

  /api/sessions/{id}/play:
    post:
      operationId: playAudio
      summary: Play an uploaded recording into a live call.
      description: >
        Plays your own audio into the call instead of synthesising speech. Pass
        `trackId` for a track in the org audio library (normalised once at
        upload, cached — no fetch on the call) or `url` for a 16-bit PCM WAV
        fetched per play (for audio your system renders per call). Exactly one.


        Returns as soon as playback is QUEUED, with the recording's duration — a
        five-minute track would otherwise hold the request open for five
        minutes. Playing again supersedes whatever is currently playing. The
        session must still be active (an ended one is 400). A url the server cannot fetch or a
        track it cannot load is 400.


        Works on an agent call and on a **manual (softphone)** call alike. With
        `init-web-call { mode: "manual" }` and the `call.dtmf` webhook, that is a
        fully programmable call — dial, play your recording, collect keypresses —
        with no browser leg and no AI in the loop.
      security: [{ ApiKeyAuth: [] }, { BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trackId:
                  type: string
                  format: uuid
                  description: An org audio-library track id.
                url:
                  type: string
                  format: uri
                  description: HTTPS URL to a 16-bit PCM WAV (8 MB cap).
                  example: 'https://example.com/order-confirm.wav'
              oneOf:
                - required: [trackId]
                - required: [url]
      responses:
        '200':
          description: Playback queued
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [sessionId, trackId, url, durationMs]
                    properties:
                      sessionId: { type: string, format: uuid }
                      trackId: { type: string, format: uuid, nullable: true }
                      url: { type: string, nullable: true }
                      durationMs: { type: integer, example: 8400 }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/sessions/{id}:
    delete:
      operationId: endSession
      summary: End a session (hang up). API key or user JWT.
      description: >
        Ends a call this server holds. Ending it again is 200 while the server still holds it (15
        minutes after the end); a call no server holds — an unknown id, another organization's, or
        a stored one long over — is 404.
      security: [{ ApiKeyAuth: [] }, { BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/sessions/init-web-call:
    post:
      operationId: initWebCall
      summary: Initialize a browser/app call (AI agent), or bridge a manual/softphone telephony call.
      description: >
        Two modes. **Agent mode** (`mode` omitted/`"agent"`) starts an AI web
        session — the orchestrator drives STT→LLM→TTS. **Manual mode**
        (`mode: "manual"`) places a softphone telephony call: Telenow rings
        `toNumber` from your org's `fromNumber` caller-ID and bridges the carrier
        leg to a human on a browser/app — no AI, no STT/LLM/TTS. Both return
        `{ sessionId, websocketUrl }`; connect a client SDK to `websocketUrl` as
        the agent's (agent mode) or human's (manual mode) audio leg. Recordings
        and webhooks (`call.started`, `call.ended`, `recording.ready`) fire in
        both modes. Authorize with a client token (Bearer) or API key.
        Agent mode needs `agentId` (400) of one of your agents (another organization's is 403, an
        unknown one 404). A client token cannot start a manual call (403). The account must be able
        to spend (403), a browser-call slot must be free (429); a provider that cannot be set up
        is 502. The session ends by itself if no client connects to `websocketUrl` within 60
        seconds.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: ['agent', 'manual']
                  default: agent
                  description: '`agent` = AI web session. `manual` = softphone telephony bridge.'
                agentId:
                  type: string
                  description: Required for agent mode; ignored in manual mode.
                fromNumber:
                  type: string
                  example: '+15550001111'
                  description: >
                    Manual mode caller-ID — an E.164 number your org owns
                    (Numbers / BYOC / SIP). Required with an API key; on a
                    user JWT it defaults to the member's allocated number.
                toNumber:
                  type: string
                  example: '+15551234567'
                  description: Manual mode — destination to ring (E.164).
                variables: { type: object, additionalProperties: { type: string } }
                identifier:
                  type: string
                  description: Trusted caller identifier, injected into tool calls when the agent opts in (agent mode).
                userId: { type: string, format: uuid }
                firstResponse:
                  type: string
                  description: >
                    Agent mode — override the agent's opening line for THIS
                    session. When set (non-blank) the agent speaks this text
                    first instead of its saved opener (e.g. a personalized
                    `"Hi {name}!"`). Variables resolve against `variables`.
      responses:
        '200':
          description: Session ready
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/SessionInfo' } }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/public/widget/{slug}/session:
    post:
      operationId: createPublicWidgetSession
      summary: Start an anonymous public-widget session (no auth).
      description: >
        For an agent published as a public widget. An unknown or unpublished slug is 404; a wrong
        `accessCode`, or an `Origin` the widget does not allow, is 403. Ten sessions a minute per
        widget and client address; past that, 400 "Too many attempts". `lead` keeps at most 20
        fields (keys cut to 64 characters, values to 500) — more are dropped, not refused.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accessCode: { type: string }
                variables: { type: object, additionalProperties: { type: string } }
                lead: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Session ready
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/SessionInfo' } }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  # ── Agents, by an org API key (or a dashboard login with X-Org-Id). The key's org is the agent's
  #    org; another org's agent id answers 404. Writes need an owner, admin or developer key — a
  #    member or viewer key gets 403 "This API key's role can't modify agents". ──
  /api/agents:
    get:
      operationId: listAgents
      summary: List the org's agents, a page at a time (most recently updated first unless `sort` says otherwise).
      parameters:
        - { name: limit, in: query, required: false, description: 'Clamped to 1–200.', schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, required: false, description: 'Matches the name (and description).', schema: { type: string } }
        - { name: isActive, in: query, required: false, schema: { type: boolean } }
        - { name: kind, in: query, required: false, description: '`flow` (a multi-context graph) or `single`.', schema: { type: string, enum: [flow, single] } }
        - { name: status, in: query, required: false, description: '`draft` (has unpublished config) or `published`.', schema: { type: string, enum: [draft, published] } }
        - { name: env, in: query, required: false, description: "Matched against `metadata.environment`.", schema: { type: string, enum: [dev, staging, prod] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [new, old, az, za] } }
        - { $ref: '#/components/parameters/AgentView' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [agents, total, limit, offset]
                    properties:
                      agents: { type: array, items: { $ref: '#/components/schemas/AgentRecord' } }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAgent
      summary: Create an agent.
      description: Needs an owner, admin or developer key.
      parameters: [{ $ref: '#/components/parameters/AgentView' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AgentRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/agents/{id}:
    get:
      operationId: getAgent
      summary: 'One agent (anyone may read a public agent, its secrets removed).'
      description: >-
        The key is optional here. With your key: one of your agents (provider keys masked unless an
        owner or admin key asks for `view=edit`); another organization's agent is 403. With no key:
        a PUBLIC agent is readable by anyone, its provider keys and tool secrets removed; a private
        one is 403. An unknown id is 404 either way. A key that is not valid is read as no key.
      security: [{ ApiKeyAuth: [] }, {}]
      parameters: [{ $ref: '#/components/parameters/AgentId' }, { $ref: '#/components/parameters/AgentView' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AgentRecord' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateAgent
      summary: 'Replace an agent''s configuration (a new version).'
      description: >-
        Needs an owner, admin or developer key. Every save appends a version (`version` in the
        answer; see listAgentVersions). Send `If-Match: "<version>"` to save only if the agent is
        still at that version — otherwise 409 with code `agent_version_conflict` and `currentVersion`.
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { $ref: '#/components/parameters/AgentView' }
        - { name: If-Match, in: header, required: false, description: 'One version, quoted: "12".', schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [success, data, version]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AgentRecord' }
                  version: { type: integer, nullable: true, description: 'The version this save made.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
    delete:
      operationId: deleteAgent
      summary: Delete an agent (it stops answering; its calls and history stay).
      description: >-
        Needs an owner, admin or developer key. Where the deployment turns on its delete guard,
        only an owner or admin key may, and an agent still answering a number, used by an active
        campaign, or handed calls by another agent answers 409 naming what uses it.
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/stats:
    get:
      operationId: getAgentStats
      summary: The agent's lifetime call totals and average latencies.
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AgentStats' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/language-suggestion:
    get:
      operationId: suggestAgentLanguages
      summary: The languages the agent's own text looks written in — a starting point for its language list. Calls no model.
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [suggested, fromVoiceLanguage, linesRead]
                    properties:
                      suggested: { type: array, items: { type: string }, description: 'Language keys, "code|Name": "hi-IN|Hindi".' }
                      fromVoiceLanguage: { type: string, nullable: true, description: "The voice's own language setting, if any." }
                      linesRead: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/voice-preview:
    post:
      operationId: previewAgentVoice
      summary: Hear the agent — a short WAV clip in its voice.
      description: >-
        Synthesises on the agent's own provider and key (or Telenow's), so it is a paid request and
        meets the same spend check as a call (403 when the account is suspended or out of credit).
        Needs an owner, admin or developer key. Throttled per org (429 with `retryAfter`). The text
        is cut to 500 characters (200 on a realtime voice).
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, description: 'Default: a short greeting.' }
      responses:
        '200':
          description: The clip.
          headers:
            x-voice-engine: { description: '`cascade` (text to speech) or `s2s` (a realtime voice).', schema: { type: string } }
            x-voice-provider: { schema: { type: string } }
            x-voice-model: { description: 'Empty on the cascade engine.', schema: { type: string } }
            x-voice-id: { schema: { type: string } }
          content:
            audio/wav: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/logo:
    post:
      operationId: uploadAgentLogo
      summary: Store an image as the agent's logo; then save the agent with `metadata.logoKey` set to the `key` returned.
      description: >-
        PNG, JPEG or WebP, at most 512 KB (the bytes are stored as sent — send a small square).
        Needs an owner, admin or developer key. The agent itself is not changed by this call.
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'Part Content-Type image/png, image/jpeg or image/webp.' }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [key, url, size]
                    properties:
                      key: { type: string, example: 'agent-logos/<orgId>/<agentId>/<uuid>.png' }
                      url: { type: string, description: 'A public URL of the stored image.' }
                      size: { type: integer, description: Bytes. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/app-tools:
    get:
      operationId: listAgentAppTools
      summary: The installed-app tools this agent can run as flow tool steps.
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [tools]
                    properties:
                      tools:
                        type: array
                        items:
                          type: object
                          required: [name, description, appId, spec]
                          properties:
                            name: { type: string, nullable: true }
                            description: { type: string, nullable: true }
                            appId: { type: string, nullable: true }
                            spec: { type: object, additionalProperties: true, description: 'The tool as the agent runs it (name, description, parameters as JSON Schema, config).' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/versions:
    get:
      operationId: listAgentVersions
      summary: The agent's saved versions, newest first (at most 100).
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [versions]
                    properties:
                      versions: { type: array, items: { $ref: '#/components/schemas/AgentVersion' } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/versions/{version}/diff:
    get:
      operationId: diffAgentVersion
      summary: What this version changed from the one before it, as display rows (secrets masked, long text cut; at most 60 rows).
      parameters: [{ $ref: '#/components/parameters/AgentId' }, { $ref: '#/components/parameters/AgentVersionNumber' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [changes]
                    properties:
                      changes:
                        type: array
                        items:
                          type: object
                          required: [path, from, to]
                          properties:
                            path: { type: string, description: 'A display label: "System prompt", "LLM config · temperature".' }
                            from: { type: string, nullable: true }
                            to: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/versions/{version}/perf:
    get:
      operationId: getAgentVersionPerf
      summary: How calls went while this version was live, beside the version before it.
      parameters: [{ $ref: '#/components/parameters/AgentId' }, { $ref: '#/components/parameters/AgentVersionNumber' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [current, previous]
                    properties:
                      current: { $ref: '#/components/schemas/AgentVersionPerf' }
                      previous: { allOf: [{ $ref: '#/components/schemas/AgentVersionPerf' }], nullable: true, description: 'Null for the first version.' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/versions/{version}/restore:
    post:
      operationId: restoreAgentVersion
      summary: Put the agent back to this version's config; the restore is itself saved as a new version.
      description: Needs an owner, admin or developer key.
      parameters: [{ $ref: '#/components/parameters/AgentId' }, { $ref: '#/components/parameters/AgentVersionNumber' }, { $ref: '#/components/parameters/AgentView' }]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AgentRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/analysis/rollup:
    get:
      operationId: getAgentAnalysisRollup
      summary: Post-call analysis totals for the agent over a window (default — the last 30 days).
      description: An agent id with no analysed calls (or not in this org) answers zeros.
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: 'Default: now. The window is [from, to).', schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [from, to, rollup]
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      rollup: { $ref: '#/components/schemas/AgentAnalytics' }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/analysis/calls:
    get:
      operationId: listAgentAnalyzedCalls
      summary: The agent's analysed calls in a window, newest first.
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { name: from, in: query, required: false, description: 'Default: 30 days before `to`.', schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: 'Default: now.', schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, description: 'Clamped to 1–200.', schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      required: [sessionId, createdAt, sentiment, disposition, score, summary, hallucinationCount]
                      properties:
                        sessionId: { type: string, format: uuid }
                        createdAt: { type: string, format: date-time }
                        sentiment: { type: string, nullable: true }
                        disposition: { type: string, nullable: true }
                        score: { type: integer, nullable: true }
                        summary: { type: string, nullable: true }
                        hallucinationCount: { type: integer }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }

  /api/agents/{id}/analysis/memory:
    get:
      operationId: listCallerMemory
      summary: What the org's agents remember about callers (at most 200, most recently updated first).
      description: Memory is kept per caller for the whole org, so the answer is the same for every agent id.
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: '#/components/schemas/CallerMemory' } }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      operationId: forgetCaller
      summary: Erase what the org's agents remember about one caller.
      description: >-
        A permanent delete, org-wide like the list; `removed` is false when nothing matched. Needs
        an owner, admin or developer key.
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { name: caller, in: query, required: true, description: 'The caller as stored (`callerKey`) or a phone number.', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [removed]
                    properties:
                      removed: { type: boolean }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/agents/preflight:
    post:
      operationId: preflightVoiceStack
      summary: Check that the speech-to-text, text-to-speech and LLM providers answer with the keys a call would use.
      description: >-
        With only `agentId`: checks the agent's saved stack and records the verdicts (see
        getKeyHealth). With provider fields: checks those (with `agentId`, a masked key is taken
        from that agent for the same provider; without it, a masked key is refused). Opens a real
        connection to each provider (the LLM check spends a few tokens); each check waits at most
        8 s. Throttled per org (429 with `retryAfter`). Needs an owner, admin or developer key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId: { type: string, format: uuid }
                sttProvider: { type: string }
                sttConfig: { type: object, additionalProperties: true }
                ttsProvider: { type: string }
                ttsVoice: { type: string }
                ttsConfig: { type: object, additionalProperties: true }
                llmProvider: { type: string }
                llmModel: { type: string }
                llmConfig: { type: object, additionalProperties: true }
      responses:
        '200':
          description: One report per component that names a provider (stt, tts, llm, in that order).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [reports, persisted, analysisModel]
                    properties:
                      reports: { type: array, items: { $ref: '#/components/schemas/PreflightReport' } }
                      persisted: { type: boolean }
                      analysisModel: { allOf: [{ $ref: '#/components/schemas/ModelCheck' }], nullable: true, description: "The agent's post-call analysis model, checked too (agentId-only, when it names one)." }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }

  /api/agents/analysis-model-check:
    post:
      operationId: checkAnalysisModel
      summary: Whether a model can run post-call analysis — tried once with a sample call, the verdict cached.
      description: >-
        An unusable input (provider not openai, anthropic, groq or openrouter; empty or malformed
        model) answers 200 with `ok` false and the reason. A new check runs on Telenow's key and is
        throttled per org (429 with `retryAfter`). Needs an owner, admin or developer key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string }
                model: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ModelCheck' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }

  /api/agents/key-health:
    get:
      operationId: getKeyHealth
      summary: The last verdict on each agent's provider keys (failing first), from preflight checks and the background sweep.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          required: [agentId, agentName, component, provider, keySource, ok, attribution, error, checkedAt]
                          properties:
                            agentId: { type: string, format: uuid }
                            agentName: { type: string }
                            component: { type: string, enum: [stt, tts, llm, analysis] }
                            provider: { type: string }
                            keySource: { type: string, enum: [byok, platform] }
                            ok: { type: boolean }
                            attribution: { type: string, nullable: true, enum: [customer_account, customer_config, provider_outage, platform, unknown] }
                            error: { type: string, nullable: true }
                            checkedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }

  /api/agents/provider-health:
    get:
      operationId: getProviderHealth
      summary: Provider failures on the org's recent calls, grouped by component, provider, key and cause.
      parameters:
        - { name: minutes, in: query, required: false, description: 'The window; clamped to 1–1440.', schema: { type: integer, minimum: 1, maximum: 1440, default: 60 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [windowMinutes, callsAffected, groups]
                    properties:
                      windowMinutes: { type: integer }
                      callsAffected: { type: integer }
                      groups:
                        type: array
                        items:
                          type: object
                          required: [component, provider, keySource, attribution, calls, incidents, lastAt, lastError, agentIds, agentNames]
                          properties:
                            component: { type: string }
                            provider: { type: string }
                            keySource: { type: string }
                            attribution: { type: string }
                            calls: { type: integer }
                            incidents: { type: integer }
                            lastAt: { type: string, format: date-time }
                            lastError: { type: string, nullable: true }
                            agentIds: { type: array, items: { type: string, format: uuid } }
                            agentNames: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }

  /api/agents/live-calls:
    get:
      operationId: countLiveCalls
      summary: Calls in progress right now, per agent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [counts, total]
                    properties:
                      counts: { type: object, additionalProperties: { type: integer }, description: 'Agent id → calls in progress; an agent with none is absent.' }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }

  /api/agents/flow/validate:
    post:
      operationId: validateFlow
      summary: Check a flow graph exactly as calls will, before saving it (a graph that fails here makes the agent run single-context).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow]
              properties:
                flow: { type: object, additionalProperties: true, description: "The graph, as `metadata.flow` holds it." }
                variables: { type: array, items: { type: object, additionalProperties: true }, description: "The agent's variables ({name, required, default, …})." }
      responses:
        '200':
          description: The verdict (not an error when the graph is invalid).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [valid, errors, warnings, multiContext]
                    properties:
                      valid: { type: boolean }
                      errors: { type: array, items: { type: string } }
                      warnings:
                        type: array
                        items:
                          type: object
                          required: [code, at, message]
                          properties:
                            code: { type: string }
                            at: { type: string }
                            message: { type: string }
                      multiContext: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/agents/prompt/validate:
    post:
      operationId: validatePrompt
      summary: Check a prompt's conditional sections and lint it; given sample values, render it as a call would get it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, maxLength: 12000 }
                kind: { type: string, enum: [single, flowBase], default: single, description: "`flowBase`: a flow's base prompt." }
                greeting: { type: string, maxLength: 12000 }
                variables: { type: array, items: { type: object, additionalProperties: true } }
                values: { type: object, additionalProperties: true, description: 'Sample values; when sent (even {}), the answer carries `rendered` and `decisions`.' }
                tools: { type: array, items: { type: string } }
                writtenBySteps: { type: array, items: { type: string } }
                channel: { type: string, enum: [web, phone_inbound, phone_outbound, whatsapp, instagram, chat] }
      responses:
        '200':
          description: The verdict (not an error when the prompt has findings).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [valid, errors, warnings]
                    properties:
                      valid: { type: boolean }
                      errors: { type: array, items: { $ref: '#/components/schemas/PromptFinding' } }
                      warnings: { type: array, items: { $ref: '#/components/schemas/PromptFinding' } }
                      rendered: { type: string, description: 'Only when `values` was sent.' }
                      decisions:
                        type: array
                        description: 'Only when `values` was sent: which branch each conditional section took.'
                        items:
                          type: object
                          required: [section, line, branch, branches]
                          properties:
                            section: { type: integer }
                            line: { type: integer }
                            branch: { type: integer, nullable: true }
                            branches: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/agent-defaults:
    get:
      operationId: getAgentDefaults
      summary: The provider stack a new agent should start from for a country (the org's own, else Telenow's).
      parameters:
        - { name: country, in: query, required: false, description: "Two letters (ISO 3166-1); anything else is ignored and the org's country is used.", schema: { type: string } }
      responses:
        '200':
          description: OK. An empty string means no recommendation for that field.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [llmProvider, llmModel, sttProvider, sttConfig, ttsProvider, ttsVoice, ttsConfig, country, countrySource, source, demoted, enabled]
                    properties:
                      llmProvider: { type: string }
                      llmModel: { type: string }
                      sttProvider: { type: string }
                      sttConfig: { type: object, additionalProperties: true }
                      ttsProvider: { type: string }
                      ttsVoice: { type: string }
                      ttsConfig: { type: object, additionalProperties: true }
                      country: { type: string, nullable: true }
                      countrySource: { type: string, enum: [explicit, org.country, org.timezone, unknown] }
                      source: { type: string, enum: [org, platform, any, none] }
                      demoted: { type: array, items: { type: string }, description: 'Why a recommended provider was dropped (e.g. not configured here).' }
                      enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }

  # ── An agent's knowledge bases (where the deployment has the knowledge module). The path's
  #    orgId must be the key's org. Writes need an owner, admin or developer key, created by an
  #    owner, admin or developer of the org. Keys here are snake_case, as the knowledge routes'. ──
  /api/orgs/{orgId}/agents/{agentId}/knowledge-bases:
    get:
      operationId: listAgentKnowledgeBases
      summary: The knowledge bases the agent answers from, each with the documents it is limited to.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/AgentIdInOrg' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [knowledgeBases, total]
                    properties:
                      knowledgeBases: { type: array, items: { $ref: '#/components/schemas/AgentKnowledgeBase' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: setAgentKnowledgeBases
      summary: Replace the agent's whole set of knowledge bases in one step ([] detaches them all).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/AgentIdInOrg' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgeBases]
              properties:
                knowledgeBases:
                  type: array
                  items:
                    type: object
                    required: [kbId]
                    properties:
                      kbId: { type: string, format: uuid }
                      documentIds: { type: array, items: { type: string, format: uuid }, nullable: true, description: 'Limit the agent to these documents; omitted or null = the whole base.' }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/agents/{agentId}/knowledge-bases/{kbId}:
    post:
      operationId: attachAgentKnowledgeBase
      summary: Attach one knowledge base to the agent (again, to change its document limit).
      description: >-
        Without `documentIds`, a new attachment covers the whole base and an existing one keeps its
        limit. An empty `documentIds` is refused (omit it to attach the whole base). 409 when the
        base belongs to a different client than the agent.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/AgentIdInOrg' }, { $ref: '#/components/parameters/KbId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                documentIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: detachAgentKnowledgeBase
      summary: Detach a knowledge base from the agent (200 whether or not it was attached).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/AgentIdInOrg' }, { $ref: '#/components/parameters/KbId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ── Calls and recordings, by an org API key. The path's orgId must be the key's org. Writes need an
  #    owner, admin or developer key ("This API key's role ('viewer') is read-only on this endpoint");
  #    the key's creator must be a member. Call rows use snake_case keys; money is a decimal string. ──
  /api/orgs/{orgId}/calls:
    get:
      operationId: listCalls
      summary: The org's calls — a filtered page (newest first by default), or with updatedAfter / cursor every change in order.
      description: >-
        Page mode: filters, `sort`, `limit` / `offset`; with no `from`, `to` or `asOf`, the last 30
        days. `total` is counted only on the first page of a window of at most 92 days (else null).
        Feed mode (`updatedAfter` or `cursor`): every call created or changed after the position,
        oldest change first, `nextCursor` to resume — a call comes back whenever it changes (ended,
        charged, analysed, recorded, wrapped up). No filters in feed mode (400 naming them).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, description: 'active, inactive, ended, …', schema: { type: string } }
        - { name: callMode, in: query, required: false, description: '`agent` or `manual`.', schema: { type: string } }
        - { name: channel, in: query, required: false, schema: { $ref: '#/components/schemas/CallChannel' } }
        - { name: disposition, in: query, required: false, schema: { type: string } }
        - { name: campaignId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, description: 'First day (YYYY-MM-DD, in `tz`), inclusive.', schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: 'Last day (YYYY-MM-DD, in `tz`), inclusive.', schema: { type: string, format: date } }
        - { name: tz, in: query, required: false, description: 'IANA zone for from / to (default Asia/Kolkata).', schema: { type: string } }
        - { name: asOf, in: query, required: false, description: 'Calls started before this instant (a stable view while paging).', schema: { type: string, format: date-time } }
        - { name: mine, in: query, required: false, description: "Only calls the key's creator started.", schema: { type: boolean } }
        - { name: caller, in: query, required: false, description: 'Digits matched inside the caller number.', schema: { type: string } }
        - { name: number, in: query, required: false, description: 'Comma-separated; digits matched inside either number.', schema: { type: string } }
        - { name: sessionId, in: query, required: false, description: 'Comma-separated call ids (invalid ones are counted in `warnings`).', schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, oldest, longest, shortest], default: newest } }
        - { name: limit, in: query, required: false, description: 'Clamped to 1–200.', schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: withTotal, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: include, in: query, required: false, description: '`facets`: counts per channel, status, mode, disposition and campaign.', schema: { type: string, enum: [facets] } }
        - { name: updatedAfter, in: query, required: false, description: 'Feed mode: calls changed after this instant (exclusive).', schema: { type: string, format: date-time } }
        - { name: cursor, in: query, required: false, description: 'Feed mode: a nextCursor this route returned. Not with updatedAfter.', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [calls, total]
                    properties:
                      calls: { type: array, items: { $ref: '#/components/schemas/CallRow' } }
                      total: { type: integer, nullable: true }
                      nextCursor: { type: string, description: 'Feed mode only (always set there): send it back as cursor.' }
                      facets:
                        type: object
                        description: 'Only with include=facets; a dimension with no values is absent.'
                        properties:
                          channel: { type: array, items: { $ref: '#/components/schemas/FacetCount' } }
                          status: { type: array, items: { $ref: '#/components/schemas/FacetCount' } }
                          call_mode: { type: array, items: { $ref: '#/components/schemas/FacetCount' } }
                          disposition: { type: array, items: { $ref: '#/components/schemas/FacetCount' } }
                          campaign:
                            type: array
                            items:
                              type: object
                              required: [value, label, count]
                              properties:
                                value: { type: string, format: uuid }
                                label: { type: string }
                                count: { type: integer }
                      warnings:
                        type: array
                        description: 'Only when some sessionId / number entries were dropped.'
                        items:
                          type: object
                          required: [code, count]
                          properties:
                            code: { type: string, enum: [invalid_session_ids, invalid_numbers] }
                            count: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/calls/{id}:
    get:
      operationId: getCall
      summary: One call with its transcript, recordings, provider stack, token use, post-call results and what is missing.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CallDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/calls/{id}/cost:
    get:
      operationId: getCallCost
      summary: "What the call was charged, by component — null until it is settled (a few minutes after it ends)."
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK (data null for a call not yet settled, unknown, or not this org's).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { allOf: [{ $ref: '#/components/schemas/CallCharge' }], nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/calls/{id}/trace:
    get:
      operationId: getCallTrace
      summary: The call's event trace (when the agent's debug mode recorded one) and its post-call events.
      description: >-
        Needs an owner or admin key whose creator is an owner or admin. Without a stored trace the
        answer carries `reason` beside `data`, and `data` holds only the post-call events (or is
        null when there are none).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  reason: { type: string, description: 'Only when no trace is stored.' }
                  data:
                    type: object
                    nullable: true
                    required: [call, schema_version, event_count, truncated, live_trace, events]
                    properties:
                      call: { $ref: '#/components/schemas/CallRow' }
                      schema_version: { type: integer }
                      event_count: { type: integer }
                      truncated: { type: boolean }
                      live_trace: { type: boolean, description: 'true when a recorded trace is included.' }
                      post_call_count: { type: integer, description: 'With a stored trace only.' }
                      max_events: { type: integer, description: 'With a stored trace only.' }
                      events: { type: array, items: { type: object, additionalProperties: true, description: 'A trace event ({type, seq, t_ms, …}) or a post-call event.' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/calls/{id}/comments:
    get:
      operationId: listCallComments
      summary: Notes left on the call, oldest first.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK (empty for an unknown call).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [comments]
                    properties:
                      comments: { type: array, items: { $ref: '#/components/schemas/CallComment' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: addCallComment
      summary: Leave a note on the call.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CallComment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/calls/{id}/followups:
    get:
      operationId: listCallFollowups
      summary: Follow-ups on the call — open first, then by due date.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK (empty for an unknown call).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [followups]
                    properties:
                      followups: { type: array, items: { $ref: '#/components/schemas/CallFollowup' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: addCallFollowup
      summary: Add a follow-up to the call.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
                dueDate: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CallFollowup' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/calls/{id}/followups/{fid}:
    patch:
      operationId: updateCallFollowup
      summary: Complete, reopen or edit a follow-up — only the key whose creator wrote it may.
      description: A follow-up written by someone else answers 404, like an unknown one.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/CallId' }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, done] }
                body: { type: string, description: 'Blank leaves it as it is.' }
                dueDate: { type: string, format: date-time }
                clearDueDate: { type: boolean, default: false, description: 'Wins over dueDate.' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CallFollowup' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/calls/{id}/insights:
    get:
      operationId: getCallInsights
      summary: The call's insights (sentiment, summary, topics, talk split), once generated.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CallInsights' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: generateCallInsights
      summary: Generate (or regenerate) the call's insights from its transcript.
      description: >-
        Runs on Telenow's model at no charge to the account. Without a model available, only the
        word and turn counts are filled (`model` null).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CallInsights' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/calls/{id}/wrapup:
    post:
      operationId: wrapUpCall
      summary: Record how the call ended for the team (a wrap-up disposition), with an optional note.
      description: The last wrap-up wins; a note is added as a comment. The call reappears in the change feed.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition]
              properties:
                disposition: { type: string, minLength: 1, maxLength: 64 }
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [id, wrapupDisposition]
                    properties:
                      id: { type: string, format: uuid }
                      wrapupDisposition: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/calls/{id}/listen:
    post:
      operationId: listenToCall
      summary: A one-time ticket to listen to a live call (both legs, read-only).
      description: >-
        The key's creator must be an owner or admin. Open `wsUrl` within 30 s; it streams binary
        frames — one leg byte (0 customer, 1 agent) and 8 kHz μ-law audio. 409 when the call is
        not live.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveTicketAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/calls/{id}/stream-ticket:
    post:
      operationId: streamCallEvents
      summary: A one-time ticket to follow a live call's events and partial transcript.
      description: Open `wsUrl` within 30 s; it sends JSON text frames {topic, sessionId, data}. 409 when the call is not live.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveTicketAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/calls/columns:
    get:
      operationId: listCallColumns
      summary: The columns a call export can carry, which are default, and the row caps.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [columns, maxRows, maxRowsWide, channels]
                    properties:
                      columns:
                        type: array
                        items:
                          type: object
                          required: [id, header, wide, default, gridDefault]
                          properties:
                            id: { type: string }
                            header: { type: string }
                            wide: { type: boolean, description: 'A wide column lowers the row cap to maxRowsWide.' }
                            default: { type: boolean, description: 'Exported when `fields` is not given.' }
                            gridDefault: { type: boolean }
                      maxRows: { type: integer }
                      maxRowsWide: { type: integer }
                      channels: { type: array, items: { $ref: '#/components/schemas/CallChannel' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/calls/export:
    get:
      operationId: exportCalls
      summary: The filtered calls as a CSV file (the list's filters; `fields` picks and orders the columns).
      description: >-
        At most maxRows rows (maxRowsWide with a wide column, see listCallColumns); a larger set is
        cut and says so in its headers. Two exports run at a time per server (429 with `retryAfter`).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: fields, in: query, required: false, description: 'Comma-separated column ids; default the default columns.', schema: { type: string } }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: callMode, in: query, required: false, schema: { type: string } }
        - { name: channel, in: query, required: false, schema: { $ref: '#/components/schemas/CallChannel' } }
        - { name: disposition, in: query, required: false, schema: { type: string } }
        - { name: campaignId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: tz, in: query, required: false, schema: { type: string } }
        - { name: asOf, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: mine, in: query, required: false, schema: { type: boolean } }
        - { name: caller, in: query, required: false, schema: { type: string } }
        - { name: number, in: query, required: false, schema: { type: string } }
        - { name: sessionId, in: query, required: false, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, oldest, longest, shortest], default: newest } }
      responses:
        '200':
          description: The file (UTF-8, CRLF, a header row).
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="calls-YYYY-MM-DD.csv" (…-partial-<kept>-of-<total>.csv when cut).' }
            x-export-truncated: { schema: { type: string, enum: ['true', 'false'] } }
            x-export-rows: { schema: { type: integer }, description: 'When cut: rows kept.' }
            x-export-total: { schema: { type: integer }, description: 'When cut: rows that matched.' }
            x-export-columns: { schema: { type: string }, description: '"<n>-of-<all>".' }
          content:
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/recordings:
    get:
      operationId: listRecordings
      summary: The org's recordings, newest first — the latest 200, or with sessionId / limit / cursor a page.
      description: >-
        Without sessionId, limit or cursor: the newest 200 (agentId narrows them), `total` = rows
        returned. With any of them: a page in (created_at, id) order, `nextCursor` set when the page
        is full.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: sessionId, in: query, required: false, description: "One call's recordings.", schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, description: 'Clamped to 1–200.', schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: cursor, in: query, required: false, description: 'A nextCursor this route returned.', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [recordings, total]
                    properties:
                      recordings: { type: array, items: { $ref: '#/components/schemas/Recording' } }
                      total: { type: integer, description: 'Rows in this answer.' }
                      nextCursor: { type: string, nullable: true, description: 'Paged only: null on the last page.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/recordings/upload:
    post:
      operationId: uploadRecording
      summary: Store a recording (up to 100 MB), optionally tied to a call and an agent.
      description: >-
        Fires `recording.ready` to the org's webhooks. Tied to a call, it replaces that call's
        server-side fallback recording. `session_id` and `agent_id` must be this org's own (404
        otherwise, before anything is stored).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                session_id: { type: string, format: uuid, description: 'The call it records.' }
                agent_id: { type: string, format: uuid }
                channel: { type: string, maxLength: 20, default: web }
                mime: { type: string, maxLength: 60, default: audio/wav }
                sample_rate: { type: integer }
                duration_sec: { type: integer, description: 'Seconds; derived from a WAV when missing or out of range.' }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Recording' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/recordings/{id}:
    get:
      operationId: getRecording
      summary: 'One recording''s details.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/RecordingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Recording' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/recordings/{id}/file:
    get:
      operationId: downloadRecording
      summary: "The recording's audio, in the type it was stored as (no ranges)."
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/RecordingId' }]
      responses:
        '200': { $ref: '#/components/responses/RecordingAudio' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/recordings/{id}/signed-url:
    get:
      operationId: signRecordingUrl
      summary: A link to the recording's audio that works without a key for 5 minutes.
      description: >-
        On a deployment that stores recordings in object storage, a presigned URL. Otherwise (and
        for a recording stored elsewhere than the current store, 502) download it with
        downloadRecording.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/RecordingId' }]
      responses:
        '200': { $ref: '#/components/responses/SignedUrl' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/call-audio/{id}/file:
    get:
      operationId: downloadCallAudio
      summary: The same as downloadRecording, at a path ad blockers leave alone.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/RecordingId' }]
      responses:
        '200': { $ref: '#/components/responses/RecordingAudio' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/call-audio/{id}/signed-url:
    get:
      operationId: signCallAudioUrl
      summary: The same as signRecordingUrl, at a path ad blockers leave alone.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/RecordingId' }]
      responses:
        '200': { $ref: '#/components/responses/SignedUrl' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  # ── Inbound routing: the org's own endpoint, asked which agent should answer a call to a pool number.
  #    Writes need an owner, admin or developer key made by an owner, admin or developer. ──
  /api/orgs/{orgId}/inbound-routing:
    get:
      operationId: getInboundRouting
      summary: "The org's inbound-routing endpoint (data null when none is set). The signing secret is never shown here."
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { allOf: [{ $ref: '#/components/schemas/InboundRouting' }], nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: setInboundRouting
      summary: Set the endpoint Telenow asks, for each call to a pool number, which agent answers.
      description: >-
        https only, on a public host. The answer carries `signingSecret` in full only when this
        request made one (the first time, or `rotateSecret`); keep it — requests to your endpoint
        are signed with it (`X-Telenow-Signature`). `timeoutMs` not sent means 1200.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 'https://, a public host.' }
                timeoutMs: { type: integer, minimum: 200, maximum: 3000, nullable: true, default: 1200 }
                enabled: { type: boolean, nullable: true, description: 'Not sent: as it was (true at first).' }
                rotateSecret: { type: boolean, default: false }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/InboundRouting' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
    delete:
      operationId: removeInboundRouting
      summary: Remove the endpoint (pool numbers then answer with their own agent). The secret goes with it.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK (removed false when none was set).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [removed]
                    properties:
                      removed: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/inbound-routing/test:
    post:
      operationId: testInboundRouting
      summary: Ask the org's endpoint about a pretend call to one of its pool numbers, and show what it answered.
      description: >-
        Sends a real signed request to the endpoint. Always 200 once the number is the org's pool
        number — whatever the endpoint did is in `answered` / `reason` / `decision`.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toNumber]
              properties:
                toNumber: { type: string, description: 'One of the org''s pool numbers.' }
                callerNumber: { type: string, nullable: true }
                forwardedFrom: { type: string, nullable: true }
      responses:
        '200':
          description: What the endpoint said
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [request, answered, elapsedMs, reason, decision, fallbackAgentId]
                    properties:
                      request: { type: object, additionalProperties: true, description: 'The request body sent to the endpoint.' }
                      answered: { type: boolean }
                      elapsedMs: { type: integer }
                      reason: { type: string, nullable: true, description: 'Why there is no decision (not configured, disabled, timed out, a bad answer, …).' }
                      decision:
                        type: object
                        nullable: true
                        required: [action, agentId, maxDurationSecs, variables, overrides]
                        properties:
                          action: { type: string, enum: [route, reject] }
                          agentId: { type: string, format: uuid, nullable: true }
                          maxDurationSecs: { type: integer, nullable: true }
                          variables: { type: object, additionalProperties: true }
                          overrides:
                            type: object
                            properties:
                              ttsVoice: { type: string, nullable: true }
                              ttsProvider: { type: string, nullable: true }
                              ttsModel: { type: string, nullable: true }
                              language: { type: string, nullable: true }
                              opener: { type: string, nullable: true }
                              personaGender: { type: string, enum: [female, male, neutral], nullable: true }
                      fallbackAgentId: { type: string, format: uuid, nullable: true, description: "The number's own agent, used when there is no decision." }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/inbound-routing/carrier-calls:
    get:
      operationId: listCarrierCalls
      summary: "The carrier's own record of calls to a pool number in a window (at most 2 hours, within the last 90 days)."
      description: >-
        For reconciling what the carrier saw with Telenow's calls. Only Plivo numbers are
        supported (`supported` false, no calls, for others). The key's creator must be an owner,
        admin or developer.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: toNumber, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: until, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [provider, supported, toNumber, from, until, calls, truncated]
                    properties:
                      provider: { type: string }
                      supported: { type: boolean }
                      toNumber: { type: string }
                      from: { type: string, format: date-time }
                      until: { type: string, format: date-time }
                      calls: { type: array, items: { $ref: '#/components/schemas/CarrierCall' } }
                      truncated: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  # ── Dialer views: one number's history, missed calls, follow-ups and outcome counts. ──
  /api/orgs/{orgId}/dial/stats:
    get:
      operationId: getDialStats
      summary: Call outcome counts (answered, machine, no answer, rejected, in progress) for the org or the key's creator.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, description: 'YYYY-MM-DD (UTC), inclusive.', schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: 'YYYY-MM-DD (UTC), inclusive.', schema: { type: string, format: date } }
        - { name: mine, in: query, required: false, description: "Only calls the key's creator made (default false with a key).", schema: { type: boolean } }
        - { name: callMode, in: query, required: false, description: '`agent` or `manual`.', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [total, answered, machine, no_answer, rejected, in_progress]
                    properties:
                      total: { type: integer }
                      answered: { type: integer }
                      machine: { type: integer }
                      no_answer: { type: integer }
                      rejected: { type: integer }
                      in_progress: { type: integer }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/dial/followups:
    get:
      operationId: listMyFollowups
      summary: "The follow-ups the key's creator wrote, with their calls — open first, then by due date."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, done] } }
        - { name: from, in: query, required: false, description: "The call's day, YYYY-MM-DD (UTC), inclusive.", schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [followups]
                    properties:
                      followups:
                        type: array
                        items:
                          type: object
                          required: [id, session_id, body, due_date, status, completed_at, created_at, agent_name, to_number, from_number, call_start]
                          properties:
                            id: { type: string, format: uuid }
                            session_id: { type: string, format: uuid }
                            body: { type: string }
                            due_date: { type: string, format: date-time, nullable: true }
                            status: { type: string, enum: [open, done] }
                            completed_at: { type: string, format: date-time, nullable: true }
                            created_at: { type: string, format: date-time }
                            agent_name: { type: string, nullable: true }
                            to_number: { type: string, nullable: true }
                            from_number: { type: string, nullable: true }
                            call_start: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/dial/missed-calls:
    get:
      operationId: listMissedCalls
      summary: Missed inbound calls not yet called back (at most 200, newest first).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: mine, in: query, required: false, description: "Only those assigned to the key's creator.", schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [missed]
                    properties:
                      missed:
                        type: array
                        items:
                          type: object
                          required: [id, from_number, to_number, call_sid, assigned_to, assigned_to_email, created_at]
                          properties:
                            id: { type: string, format: uuid }
                            from_number: { type: string }
                            to_number: { type: string }
                            call_sid: { type: string, nullable: true }
                            assigned_to: { type: string, format: uuid, nullable: true }
                            assigned_to_email: { type: string, nullable: true }
                            created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/dial/number-summary:
    get:
      operationId: getNumberSummary
      summary: How many calls one number has had — in all, in the last 48 hours, today.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: number, in: query, required: false, description: 'Matched by all its digits (fewer than 6: zeros).', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [number, total, last2Days, today]
                    properties:
                      number: { type: string }
                      total: { type: integer }
                      last2Days: { type: integer }
                      today: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/dial/number-calls:
    get:
      operationId: listNumberCalls
      summary: One number's calls (at most 200, newest first), each with who handled it and its comments.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: number, in: query, required: false, description: 'Matched by all its digits (fewer than 6: no calls).', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [number, calls]
                    properties:
                      number: { type: string }
                      calls:
                        type: array
                        items:
                          type: object
                          required: [id, callMode, startedAt, endedAt, durationSec, fromNumber, toNumber, phoneNumber, status, disposition, agentName, initiatedByEmail, who, recordingId, comments]
                          properties:
                            id: { type: string, format: uuid }
                            callMode: { type: string }
                            startedAt: { type: string, format: date-time }
                            endedAt: { type: string, format: date-time, nullable: true }
                            durationSec: { type: integer, nullable: true }
                            fromNumber: { type: string, nullable: true }
                            toNumber: { type: string, nullable: true }
                            phoneNumber: { type: string, nullable: true }
                            status: { type: string }
                            disposition: { type: string, nullable: true }
                            agentName: { type: string, nullable: true }
                            initiatedByEmail: { type: string, nullable: true }
                            who: { type: string, description: 'The agent, the member, or "Softphone".' }
                            recordingId: { type: string, format: uuid, nullable: true }
                            comments:
                              type: array
                              items:
                                type: object
                                required: [id, body, createdAt, author]
                                properties:
                                  id: { type: string, format: uuid }
                                  body: { type: string }
                                  createdAt: { type: string, format: date-time }
                                  author: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ── Do-not-call list and consent ledger. Writes need an owner, admin or developer key made by an owner,
  #    admin or developer. A number is kept as sent after removing everything but digits and a leading +. ──
  /api/orgs/{orgId}/dnc:
    get:
      operationId: listDnc
      summary: The org's do-not-call list — a page (newest first), or with updatedAfter / cursor every change in order, deletions included.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: limit, in: query, required: false, description: 'Page mode: rows (no upper cap). Feed mode: clamped to 1–200.', schema: { type: integer, minimum: 0, default: 100 } }
        - { name: offset, in: query, required: false, description: 'Page mode only.', schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, required: false, description: 'Page mode: matched inside the number or the reason.', schema: { type: string } }
        - { name: updatedAfter, in: query, required: false, description: 'Feed mode: changes after this instant (exclusive).', schema: { type: string, format: date-time } }
        - { name: cursor, in: query, required: false, description: 'Feed mode: a nextCursor this route returned. Not with updatedAfter.', schema: { type: string } }
      responses:
        '200':
          description: OK — page mode `entries` are DncEntry with `total`; feed mode `entries` are DncChange with `nextCursor`.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [entries, total]
                    properties:
                      entries: { type: array, items: { oneOf: [{ $ref: '#/components/schemas/DncEntry' }, { $ref: '#/components/schemas/DncChange' }] } }
                      total: { type: integer, nullable: true, description: 'Page mode: matching rows. Feed mode: null.' }
                      nextCursor: { type: string, description: 'Feed mode only.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: addDnc
      summary: Put a number on the list (again is fine — a new reason replaces the old one).
      description: >-
        Takes effect at once for this org: pending campaign calls to the number are suppressed and
        dials to it refused. A sub-account has its own list.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber: { type: string }
                reason: { type: string, nullable: true }
      responses:
        '201':
          description: On the list (the existing entry when it already was).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/DncEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/dnc/{id}:
    delete:
      operationId: removeDnc
      summary: Take a number off the list. Suppressed campaign calls stay suppressed.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/dnc/bulk-delete:
    post:
      operationId: bulkRemoveDnc
      summary: Take up to 10,000 entries off the list; a caller's own opt-out is kept (counted in `protected`).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 10000, items: { type: string, format: uuid } }
      responses:
        '200':
          description: OK (ids that are not this org's are ignored).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [removed, protected]
                    properties:
                      removed: { type: integer }
                      protected: { type: integer, description: 'Opt-outs among the ids, not removed.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/dnc/export:
    get:
      operationId: exportDnc
      summary: The list as CSV (phone_number, reason, source, added_at, session_id), newest first, up to 500,000 rows.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Export-Truncated: { schema: { type: string, enum: ['true', 'false'] } }
          content:
            text/csv: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/dnc/import:
    post:
      operationId: importDnc
      summary: Add numbers from a CSV — one number per line, an optional reason after the first comma (no header row).
      description: >-
        Up to 2 MB. A number already on the list keeps its reason. Lines without a dialable number
        are counted in `skipped`.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'The CSV (the part may also be named csv or numbers).' }
      responses:
        '200':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [added, skipped]
                    properties:
                      added: { type: integer }
                      skipped: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/consent:
    post:
      operationId: recordConsent
      summary: Record that a person agreed to be called (the proof campaigns need when the org requires consent).
      description: >-
        Fields are snake_case. `express_written` needs the exact `disclosure_text` they agreed to.
        `evidence` is stored with a `server` block added (who recorded it, from where).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, consent_type, source]
              properties:
                phone_number: { type: string }
                consent_type: { type: string, enum: [express_written, express_oral, implied, existing_business_relationship] }
                scope: { type: string, enum: [marketing, transactional, service], default: marketing, nullable: true }
                source: { type: string, enum: [web_form, import, api, ivr_dtmf, verbal_recorded, paper] }
                evidence: { description: 'Your proof (any JSON).' }
                disclosure_text: { type: string, nullable: true }
                disclosure_version: { type: string, nullable: true }
                captured_at: { type: string, format: date-time, nullable: true, description: 'Default: now.' }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ConsentRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/consent/{phone}:
    get:
      operationId: getConsentHistory
      summary: "Every consent recorded for a number (at most 500, newest first), revoked ones included."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: phone, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [records, total]
                    properties:
                      records: { type: array, items: { $ref: '#/components/schemas/ConsentRecord' } }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/consent/{phone}/revoke:
    post:
      operationId: revokeConsent
      summary: Withdraw a number's consent — and put it on the do-not-call list as an opt-out.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: phone, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, nullable: true, default: api }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: OK (revoked counts live consents withdrawn; 0 is not an error).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked: { type: integer }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/consent/coverage:
    get:
      operationId: getConsentCoverage
      summary: How many pending campaign calls have consent on file, and whether the org requires it.
      description: Needs an owner, admin or developer key made by an owner, admin or developer.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [pending_total, pending_covered, pending_blocked, mode]
                    properties:
                      pending_total: { type: integer }
                      pending_covered: { type: integer }
                      pending_blocked: { type: integer }
                      mode: { type: string, enum: ['off', required] }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/consent/enforcement:
    put:
      operationId: setConsentEnforcement
      summary: Require recorded consent before any call (`required`) or not (`off`).
      description: A sub-account whose billing account requires it cannot switch it off (403).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: ['off', required] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [mode]
                    properties:
                      mode: { type: string, enum: ['off', required] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  # ── Phone numbers (the org comes from the key). Writes need an owner, admin or developer key; buying
  #    and reclaiming spend the account's credit. Carrier work happens on Telenow's carrier accounts
  #    (or the org's own, for numbers it brought). Rows are snake_case; money is a decimal string. ──
  /api/voice/numbers:
    get:
      operationId: listNumbers
      summary: "The org's numbers with their price in USD — held ones, or with updatedAfter every number changed since (released ones too)."
      parameters:
        - { name: includeReleased, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: updatedAfter, in: query, required: false, description: 'Numbers changed after this instant (implies includeReleased).', schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [numbers, total]
                    properties:
                      numbers: { type: array, items: { $ref: '#/components/schemas/PricedPhoneNumber' } }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/providers:
    get:
      operationId: listNumberProviders
      summary: The carriers numbers can be bought on here, and the default.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [default, providers]
                    properties:
                      default: { type: string, nullable: true }
                      providers:
                        type: array
                        items:
                          type: object
                          required: [id, isDefault, capabilities]
                          properties:
                            id: { type: string }
                            isDefault: { type: boolean }
                            capabilities:
                              type: object
                              required: [supports_compliance, supports_integration, supports_messaging]
                              properties:
                                supports_compliance: { type: boolean }
                                supports_integration: { type: boolean }
                                supports_messaging: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/search:
    get:
      operationId: searchNumbers
      summary: Numbers for sale on a carrier, with their price in USD.
      parameters:
        - { name: country, in: query, required: true, description: 'ISO 3166-1 alpha-2.', schema: { type: string } }
        - { name: provider, in: query, required: false, description: 'Default: the default carrier.', schema: { type: string } }
        - { name: pattern, in: query, required: false, schema: { type: string } }
        - { name: match, in: query, required: false, schema: { type: string, enum: [starts, contains, ends] } }
        - { name: type, in: query, required: false, description: 'local, mobile, tollfree, … (carrier vocabulary).', schema: { type: string } }
        - { name: region, in: query, required: false, schema: { type: string } }
        - { name: services, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [provider, numbers, meta]
                    properties:
                      provider: { type: string }
                      numbers: { type: array, items: { $ref: '#/components/schemas/AvailableNumber' } }
                      meta: { nullable: true, description: "The carrier's paging data, as it sent it." }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/purchase:
    post:
      operationId: purchaseNumber
      summary: Buy a number — charged at once (setup plus the first month) to the account.
      description: >-
        Prepaid accounts need enough purchased credit (free credits cannot buy numbers). The number
        is billed monthly from then on until released. Pass the price `searchNumbers` showed in
        `extras` (`monthlyRent`, `setupPrice`) when calling directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number: { type: string, description: 'The number as searchNumbers returned it.' }
                provider: { type: string }
                integrationId: { type: string, description: 'The carrier app to bind it to (default: Telenow''s).' }
                complianceApplicationId: { type: string, format: uuid }
                metadata: { description: 'Stored on the number as sent.' }
                extras: { type: object, additionalProperties: true, description: 'Carrier hints: monthlyRent, setupPrice, country, numberType.' }
      responses:
        '201':
          description: Bought
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [number, integrationExternalId, providerStatus, complianceLinked]
                    properties:
                      number: { $ref: '#/components/schemas/PhoneNumber' }
                      integrationExternalId: { type: string, nullable: true }
                      providerStatus: { type: string, nullable: true }
                      complianceLinked: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/integration:
    get:
      operationId: getNumberIntegration
      summary: "The carrier app Telenow binds numbers to (made on first use); null for a carrier without one."
      parameters:
        - { name: provider, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    nullable: true
                    required: [provider, external_id, name]
                    properties:
                      provider: { type: string }
                      external_id: { type: string }
                      name: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/connection-status:
    get:
      operationId: getNumberConnections
      summary: Whether each of the org's numbers is bound, at its carrier, to the app that sends calls to Telenow.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [numbers, answerUrl, inboundUrls]
                    properties:
                      numbers:
                        type: array
                        items:
                          type: object
                          required: [id, e164, ourAppId, liveAppId, matches]
                          properties:
                            id: { type: string, format: uuid }
                            e164: { type: string }
                            ourAppId: { type: string, nullable: true }
                            liveAppId: { type: string, nullable: true }
                            matches: { type: boolean, nullable: true, description: 'null when the carrier could not say.' }
                      answerUrl: { type: string }
                      inboundUrls:
                        type: object
                        required: [plivo, smartflo]
                        properties:
                          plivo: { type: string }
                          smartflo: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/renewal-risk:
    get:
      operationId: getRenewalRisk
      summary: "Which numbers' next monthly rent the prepaid balance will not cover, in renewal order."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [mode, balanceUsd, graceDays, prealertDays, numbers]
                    properties:
                      mode: { type: string, enum: [prepaid, postpaid, billed_to_parent] }
                      balanceUsd: { type: string }
                      graceDays: { type: integer }
                      prealertDays: { type: integer }
                      numbers:
                        type: array
                        items:
                          type: object
                          required: [id, e164, nextRenewalAt, rentUsd, status, shortfallUsd, daysUntilRenewal]
                          properties:
                            id: { type: string, format: uuid }
                            e164: { type: string }
                            nextRenewalAt: { type: string, format: date-time, nullable: true }
                            rentUsd: { type: string }
                            status: { type: string, enum: [not_applicable, overdue, at_risk, renewing, renews_soon, ok] }
                            shortfallUsd: { type: string, nullable: true }
                            daysUntilRenewal: { type: integer, nullable: true }
        '401': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/reclaimable:
    get:
      operationId: listReclaimableNumbers
      summary: Numbers released for non-payment (not by you) that can still be recovered before the carrier's hold ends.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [numbers, total]
                    properties:
                      numbers:
                        type: array
                        items:
                          type: object
                          required: [id, e164, provider, releasedAt, reclaimDeadlineAt, releaseReason, binding, reclaimRequestedAt, lastMonthlyRent, lastSetupPrice, priceCurrency, lastMonthlyRentUsd, lastSetupPriceUsd, reclaimIsManual]
                          properties:
                            id: { type: string, format: uuid }
                            e164: { type: string }
                            provider: { type: string }
                            releasedAt: { type: string, format: date-time, nullable: true }
                            reclaimDeadlineAt: { type: string, format: date-time, nullable: true }
                            releaseReason: { type: string, nullable: true }
                            binding: { type: object, additionalProperties: true, nullable: true, description: 'What the number was set up for (agent, caller id, campaigns, price).' }
                            reclaimRequestedAt: { type: string, format: date-time, nullable: true }
                            lastMonthlyRent: { type: string, nullable: true }
                            lastSetupPrice: { type: string, nullable: true }
                            priceCurrency: { type: string, enum: [USD, INR, EUR] }
                            lastMonthlyRentUsd: { type: string, nullable: true }
                            lastSetupPriceUsd: { type: string, nullable: true }
                            reclaimIsManual: { type: boolean }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/compliance:
    get:
      operationId: listComplianceApplications
      summary: "The org's regulatory applications (the paperwork some countries need before a number can be bought)."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [applications, total]
                    properties:
                      applications: { type: array, items: { $ref: '#/components/schemas/ComplianceApplication' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: submitComplianceApplication
      summary: Submit a regulatory application to the carrier (end-user details and documents).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countryIso, numberType, alias, endUser, documents]
              properties:
                provider: { type: string }
                countryIso: { type: string }
                numberType: { type: string }
                alias: { type: string }
                endUser:
                  type: object
                  required: [type, name]
                  description: snake_case keys.
                  properties:
                    type: { type: string }
                    name: { type: string }
                    last_name: { type: string }
                    email: { type: string }
                    address_line1: { type: string }
                    address_line2: { type: string }
                    city: { type: string }
                    state: { type: string }
                    postal_code: { type: string }
                    country: { type: string }
                    registration_number: { type: string }
                    extras: { description: 'Carrier-specific.' }
                documents:
                  type: array
                  items:
                    type: object
                    required: [documentTypeId]
                    properties:
                      documentTypeId: { type: string }
                      dataFields: { description: 'Carrier-specific.' }
                      file:
                        type: object
                        required: [filename, mime, contentBase64]
                        properties:
                          filename: { type: string }
                          mime: { type: string }
                          contentBase64: { type: string }
                callbackUrl: { type: string }
                metadata: { description: 'Stored as sent.' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ComplianceApplication' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/compliance/requirements:
    get:
      operationId: getComplianceRequirements
      summary: The documents and fields a carrier needs for a country, number type and kind of end user.
      parameters:
        - { name: country, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string } }
        - { name: endUserType, in: query, required: true, schema: { type: string } }
        - { name: provider, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [provider, requirements]
                    properties:
                      provider: { type: string }
                      requirements:
                        type: array
                        items:
                          type: object
                          required: [document_type_id, name, description, proof_required, data_fields, required_fields, raw]
                          properties:
                            document_type_id: { type: string, nullable: true }
                            name: { type: string, nullable: true }
                            description: { type: string, nullable: true }
                            proof_required: { type: boolean, nullable: true }
                            data_fields: { nullable: true }
                            required_fields: { type: array, nullable: true, items: {} }
                            raw: { description: "The carrier's own entry." }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/compliance/{id}:
    get:
      operationId: getComplianceApplication
      summary: One application, its status refreshed from the carrier.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ComplianceApplication' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteComplianceApplication
      summary: Withdraw an application at the carrier and delete it (not while a number uses it).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/{id}:
    get:
      operationId: getNumber
      summary: 'One phone number.'
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/PricedPhoneNumber' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: releaseNumber
      summary: Release a number — it goes back to the carrier and its monthly rent stops (no refund).
      description: Refused (409) while the number is live on WhatsApp; remove that channel first.
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/{id}/assign-agent:
    post:
      operationId: assignNumberAgent
      summary: Have an agent answer calls to this number.
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/NumberAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/voice/numbers/{id}/agent:
    delete:
      operationId: unassignNumberAgent
      summary: Stop the number's agent answering it (not for a pool number — unmark it first).
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      responses:
        '200': { $ref: '#/components/responses/NumberAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/{id}/default-outbound:
    post:
      operationId: setDefaultOutboundNumber
      summary: Make this number (or stop it being) its agent's default caller id.
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isDefault: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/NumberAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/{id}/inbound-action:
    post:
      operationId: setNumberInboundAction
      summary: What a call to a number with no agent and no member does (speak, forward, reject, no-answer; null clears).
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, nullable: true, enum: [speak, forward, reject, no-answer] }
      responses:
        '200': { $ref: '#/components/responses/NumberAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/{id}/pool:
    post:
      operationId: setNumberPool
      summary: Mark a number as a pool number (its calls are routed by the org's inbound-routing endpoint), or unmark it.
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isPool]
              properties:
                isPool: { type: boolean }
                maxConcurrent: { type: integer, minimum: 1, nullable: true, description: 'Calls at once on this number; null for no ceiling.' }
      responses:
        '200': { $ref: '#/components/responses/NumberAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/voice/numbers/{id}/compliance:
    post:
      operationId: linkNumberCompliance
      summary: Attach an accepted compliance application to a number, at its carrier.
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [complianceApplicationId]
              properties:
                complianceApplicationId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/NumberAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/{id}/relink-integration:
    post:
      operationId: relinkNumberIntegration
      summary: Bind the number again, at its carrier, to the app that sends its calls to Telenow.
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      responses:
        '200': { $ref: '#/components/responses/NumberAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/{id}/integration:
    delete:
      operationId: unlinkNumberIntegration
      summary: Unbind the number from its carrier app (its calls stop reaching Telenow).
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      responses:
        '200': { $ref: '#/components/responses/NumberAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

  /api/voice/numbers/{id}/reclaim:
    post:
      operationId: reclaimNumber
      summary: Try to get a number back that was released for non-payment — bought again at its price if the carrier still holds it.
      description: >-
        `status` restored: it is back, set up as it was, and charged. `status` requested: the
        carrier would not give it back automatically; Telenow staff were asked to recover it.
      parameters: [{ $ref: '#/components/parameters/NumberId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ReclaimOutcome' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  # ── Campaigns: an agent calling a list of people within a window. Writes need an owner, admin or developer
  #    key made by an owner, admin or developer. A running campaign dials its pending targets within seconds;
  #    targets added to a running (or finished) campaign are dialled too. Rows are snake_case. ──
  /api/orgs/{orgId}/campaigns:
    get:
      operationId: listCampaigns
      summary: "The org's campaigns, newest first."
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [campaigns, total]
                    properties:
                      campaigns: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCampaign
      summary: Create a campaign (as a draft — add targets, then start it).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCampaignRequest' } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/campaigns/source-kinds:
    get:
      operationId: listCampaignSourceKinds
      summary: Where a campaign's call list can come from (sheets, CRMs, databases, the org's own connections).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [kinds]
                    properties:
                      kinds:
                        type: array
                        items:
                          type: object
                          required: [id, capability, providers, label, writeback, settings]
                          properties:
                            id: { type: string }
                            capability: { type: string }
                            providers: { type: array, items: { type: string } }
                            label: { type: string }
                            writeback: { type: boolean, description: 'Results can be written back to the source.' }
                            settings: { type: array, items: {} }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: One campaign, with why it is not dialling right now (`dial_block`, null when nothing stops it).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/Campaign' }
                      - type: object
                        required: [agent_uses_dtmf, dial_block]
                        properties:
                          agent_uses_dtmf: { type: boolean }
                          dial_block:
                            type: object
                            nullable: true
                            required: [kind, message, pending]
                            properties:
                              kind: { type: string, enum: [account, window] }
                              message: { type: string }
                              pending: { type: integer }
                              opensAt: { type: string, nullable: true, description: 'Window only: when it opens.' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCampaign
      summary: Delete a campaign — a running one is stopped first (calls in progress finish).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, data, message]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [deleted, stopped, priorStatus]
                    properties:
                      deleted: { type: boolean }
                      stopped: { type: boolean }
                      priorStatus: { type: string }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/campaigns/{id}/start:
    post:
      operationId: startCampaign
      summary: Start (or resume) a draft or paused campaign; anything else is left as it is.
      description: Dialling begins within seconds, inside the calling window, subject to the account's spend check per call.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/pause:
    post:
      operationId: pauseCampaign
      summary: Pause a running campaign (calls in progress finish); anything else is left as it is.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/cancel:
    post:
      operationId: cancelCampaign
      summary: Cancel a campaign for good — its pending targets are skipped.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/campaigns/{id}/concurrency:
    patch:
      operationId: setCampaignConcurrency
      summary: How many calls the campaign may have going at once (1–50).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concurrency]
              properties:
                concurrency: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200': { $ref: '#/components/responses/CampaignAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/campaigns/{id}/schedule:
    patch:
      operationId: setCampaignSchedule
      summary: Change the calling window, time zone, retries, voicemail handling and caller id.
      description: >-
        The window is always replaced: send both bounds to keep one (omitting them clears it). Other
        fields not sent stay as they are; `fromNumberId` null clears the caller id.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startTimeLocal: { type: string, example: '09:00' }
                endTimeLocal: { type: string, example: '18:00' }
                timezone: { type: string, nullable: true }
                machineDetection: { type: string, nullable: true, description: 'off, voicemail (detect) or hangup.' }
                maxAttempts: { type: integer, minimum: 1, maximum: 10, nullable: true }
                retryBackoffSecs: { type: integer, minimum: 5, maximum: 3600, nullable: true }
                retryOnNoAnswer: { type: boolean, nullable: true }
                fromNumberId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/CampaignAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/campaigns/{id}/retry-failed:
    post:
      operationId: retryFailedTargets
      summary: Queue the failed targets again (`scope` unanswered — only no-answer, busy and voicemail).
      description: Needs an owner or admin key made by an owner or admin. A finished campaign reopens and dials them.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, enum: [unanswered, all] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [retried]
                    properties:
                      retried: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/campaigns/{id}/targets:
    post:
      operationId: uploadCampaignTargets
      summary: Add people from a CSV — a header row with phone_number (or phone); every other column becomes a variable.
      description: Up to 2 MB. Numbers on the do-not-call list (and ones already pending) are counted in `suppressed`.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/TargetsAdded' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/targets/json:
    post:
      operationId: addCampaignTargets
      summary: Add people as JSON, each with its own variables.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  items:
                    type: object
                    required: [phoneNumber]
                    properties:
                      phoneNumber: { type: string }
                      variables: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/TargetsAdded' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/campaigns/{id}/targets/from-sheet:
    post:
      operationId: importCampaignTargetsFromSource
      summary: Fill the call list from one of the org's connections (a sheet, a CRM view, a database query) and keep it as a source.
      description: >-
        Reads up to 10,000 rows now; with `syncIntervalMins` the source is read again on that
        schedule. `writeback` writes each call's result back to the row. A campaign that is not
        this org's (or is deleted) is a 404, before anything is read.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId, phoneColumn]
              properties:
                connectionId: { type: string, format: uuid }
                capability: { type: string, default: sheets.list_rows }
                config: { type: object, additionalProperties: true, description: 'What to read (sheet and tab, view, query, …).' }
                phoneColumn: { type: string }
                variableColumns: { type: array, items: { type: string } }
                variableMap: { type: object, additionalProperties: { type: string }, description: 'Agent variable → column.' }
                phoneCountry: { type: string, description: 'For numbers without a country code.' }
                writeback: { type: object, additionalProperties: true }
                name: { type: string }
                syncIntervalMins: { type: integer, minimum: 5, maximum: 10080 }
                spreadsheetId: { type: string, deprecated: true }
                sheetTab: { type: string, deprecated: true }
      responses:
        '200': { $ref: '#/components/responses/SourceSynced' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
  /api/orgs/{orgId}/campaigns/{id}/targets/from-sheet/columns:
    post:
      operationId: previewCampaignSource
      summary: The columns and first rows of a source, to choose the phone column.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId]
              properties:
                connectionId: { type: string, format: uuid }
                capability: { type: string, default: sheets.list_rows }
                config: { type: object, additionalProperties: true }
                spreadsheetId: { type: string, deprecated: true }
                sheetTab: { type: string, deprecated: true }
      responses:
        '200':
          description: The first page as the source reads it (headers, rows, has_more, …).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/campaigns/{id}/sources:
    get:
      operationId: listCampaignSources
      summary: "Where the campaign's call list comes from, with each source's schedule and last sync."
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [sources]
                    properties:
                      sources: { type: array, items: { $ref: '#/components/schemas/CampaignSource' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/sources/{sourceId}:
    patch:
      operationId: updateCampaignSource
      summary: Rename a source or change how often it is read (0 or less stops the schedule).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                syncIntervalMins: { type: integer }
                name: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
    delete:
      operationId: deleteCampaignSource
      summary: Remove a source (the targets it added stay).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/SourceId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/sources/{sourceId}/sync:
    post:
      operationId: syncCampaignSource
      summary: Read a source now and add its new rows.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }, { $ref: '#/components/parameters/SourceId' }]
      responses:
        '200': { $ref: '#/components/responses/SourceSynced' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/campaigns/{id}/calls:
    get:
      operationId: listCampaignCalls
      summary: "The campaign's targets and how each went, a page at a time (latest scheduled first)."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/CampaignId' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, dialing, completed, failed, skipped, suppressed] } }
        - { name: limit, in: query, required: false, description: 'Clamped to 1–500.', schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [calls, total, statusCounts, failedTotal, failedUnanswered]
                    properties:
                      calls: { type: array, items: { $ref: '#/components/schemas/CampaignCall' } }
                      total: { type: integer }
                      statusCounts: { type: object, additionalProperties: { type: integer } }
                      failedTotal: { type: integer }
                      failedUnanswered: { type: integer, description: 'No answer or busy.' }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/calls/export:
    get:
      operationId: exportCampaignCalls
      summary: The targets and their results as CSV (up to 100,000 rows; `fields` picks and orders the columns).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/CampaignId' }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: fields, in: query, required: false, description: 'Comma-separated: phone_number, status, outcome, attempt, last_error, scheduled_for, started_at, completed_at, duration_sec, session_id, variables, dtmf_digits, dtmf_choices.', schema: { type: string } }
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Export-Truncated: { schema: { type: string, enum: ['true', 'false'] } }
          content:
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/analytics:
    get:
      operationId: getCampaignAnalytics
      summary: How the campaign went — reach, outcomes, talk time, latency, voicemail detection, cost.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CampaignAnalytics' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/reach:
    get:
      operationId: getCampaignReach
      summary: How many pending targets can be dialled, and how many the do-not-call list or missing consent hold back.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [pending, dialable, excludedDnc, excludedConsent, accountBlock]
                    properties:
                      pending: { type: integer }
                      dialable: { type: integer }
                      excludedDnc: { type: integer }
                      excludedConsent: { type: integer }
                      accountBlock: { type: string, nullable: true, description: 'Why the account cannot place calls now, if it cannot.' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/campaigns/{id}/variables:
    get:
      operationId: listCampaignVariables
      summary: "The variables the campaign's agent uses — the columns a call list should carry."
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [variables]
                    properties:
                      variables:
                        type: array
                        items:
                          type: object
                          required: [name, required, filledByLookup]
                          properties:
                            name: { type: string }
                            required: { type: boolean, description: 'The call list must carry it. False for one a pre-call lookup fills.' }
                            filledByLookup: { type: boolean, description: "A pre-call lookup fills it from the agent's connected CRM before each dial, so the call list need not carry it." }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ── /api/v1/campaigns — the same campaigns for integrations: flat JSON (no success/data wrapper). ──
  /api/v1/campaigns:
    get:
      operationId: listCampaignsV1
      summary: "The org's campaigns, newest first."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [campaigns]
                properties:
                  campaigns: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCampaignV1
      summary: Create a campaign with its first targets (up to 1,000) and, unless `start` is false, start dialling.
      description: >-
        At most 60 campaigns an hour per key and 200,000 pushed rows an hour (429 with
        `retryAfter`). Page more targets in with pushCampaignTargetsV1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/CreateCampaignRequest' }
                - type: object
                  properties:
                    start: { type: boolean, default: true }
                    targets: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PushTarget' } }
                    source: { type: string, default: api, description: 'Names where the targets came from (their dedupe scope).' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [campaign, targets]
                properties:
                  campaign: { $ref: '#/components/schemas/Campaign' }
                  targets:
                    type: object
                    nullable: true
                    required: [added, duplicates, suppressed, skipped, withoutId, source]
                    properties:
                      added: { type: integer }
                      duplicates: { type: integer }
                      suppressed: { type: integer }
                      skipped: { type: integer }
                      withoutId: { type: integer }
                      source: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/campaigns/{id}:
    get:
      operationId: getCampaignV1
      summary: 'One campaign (flat).'
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/campaigns/{id}/start:
    post:
      operationId: startCampaignV1
      summary: Start (or resume) the campaign; already running or finished is left as it is.
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200': { $ref: '#/components/responses/CampaignV1Answer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/campaigns/{id}/pause:
    post:
      operationId: pauseCampaignV1
      summary: Pause a running campaign.
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200': { $ref: '#/components/responses/CampaignV1Answer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/campaigns/{id}/targets:
    post:
      operationId: pushCampaignTargetsV1
      summary: Add up to 1,000 targets; a target with an `id` already pushed under the same `source` is a duplicate.
      description: The campaign is checked first — not this org's (or deleted) is a 404, cancelled a 400 — even when every target is a duplicate.
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                source: { type: string, default: api }
                targets: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/PushTarget' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [added, duplicates, suppressed, skipped, withoutId, source]
                properties:
                  added: { type: integer }
                  duplicates: { type: integer }
                  suppressed: { type: integer, description: 'On the do-not-call list, or already pending.' }
                  skipped: { type: integer, description: 'No phone number.' }
                  withoutId: { type: integer }
                  without_id: { type: integer, deprecated: true }
                  source: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/campaigns/{id}/results:
    get:
      operationId: getCampaignResultsV1
      summary: Finished targets in the order they finished — page with nextCursor (or start from `since`).
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
        - { name: outcome, in: query, required: false, description: 'answered, no-answer, busy, machine, failed, …', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [results, nextCursor, nextSince]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/CampaignResult' } }
                  nextCursor: { type: string, nullable: true }
                  nextSince: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  # ── Agent templates (Telenow's built-ins, the org's own, and other orgs' approved public ones) and the
  #    org's caller memory. ──
  /api/orgs/{orgId}/templates:
    get:
      operationId: listTemplates
      summary: Templates the org can install — Telenow's built-ins first, then the org's own and approved public ones.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [templates]
                    properties:
                      templates: { type: array, items: { $ref: '#/components/schemas/AgentTemplate' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: publishTemplate
      summary: Publish one of the org's agents as a template (secrets, connections and numbers removed).
      description: >-
        `visibility` org: for this org only. public: for every org once Telenow approves it — needs
        an owner or admin key made by an owner or admin.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId: { type: string, format: uuid }
                name: { type: string, nullable: true }
                description: { type: string, nullable: true }
                category: { type: string, nullable: true }
                visibility: { type: string, enum: [org, public], default: org }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AgentTemplate' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/templates/export-app-template:
    post:
      operationId: exportAgentAsAppTemplate
      summary: "One of the org's agents as an app's agent-template entry (JSON, tools removed); nothing is stored."
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId: { type: string, format: uuid }
                id: { type: string, nullable: true }
                name: { type: string, nullable: true }
                description: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [template]
                    properties:
                      template:
                        type: object
                        required: [id, name]
                        description: Keys without a value are left out.
                        properties:
                          id: { type: string }
                          name: { type: string }
                          description: { type: string }
                          systemPrompt: { type: string }
                          llmProvider: { type: string }
                          llmModel: { type: string }
                          sttProvider: { type: string }
                          ttsProvider: { type: string }
                          ttsVoice: { type: string }
                          sessionConfig: { type: object, additionalProperties: true }
                          telephonyConfig: { type: object, additionalProperties: true }
                          metadata: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/templates/{id}:
    get:
      operationId: getTemplate
      summary: One template with its full agent definition (`spec`).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/TemplateId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AgentTemplate' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTemplate
      summary: "Delete one of the org's templates (agents installed from it stay)."
      description: Needs an owner or admin key made by an owner or admin. Built-ins cannot be removed.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/TemplateId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/templates/{id}/install:
    post:
      operationId: installTemplate
      summary: Create an agent from a template, binding the connections and tools it needs.
      description: >-
        `bindings` maps each of the template's requiredCapabilities to one of the org's connections;
        `mcpBindings` maps each required MCP server URL to an MCP connection.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/TemplateId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, nullable: true }
                bindings: { type: object, additionalProperties: { type: string } }
                toolBindings: { type: object, additionalProperties: { type: object, additionalProperties: true } }
                mcpBindings: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: The new agent
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [agentId, name]
                    properties:
                      agentId: { type: string, format: uuid }
                      name: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/orgs/{orgId}/memory:
    get:
      operationId: listOrgCallerMemory
      summary: What the org's agents remember about callers (at most 200, most recently updated first).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: '#/components/schemas/CallerMemory' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      operationId: eraseOrgCallerMemory
      summary: Erase what the org's agents remember about one caller (a permanent delete).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: caller, in: query, required: true, description: 'As stored (callerKey) or a phone number; percent-encode a +.', schema: { type: string } }
      responses:
        '200':
          description: OK (removed false when nothing matched).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [removed]
                    properties:
                      removed: { type: boolean }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ── Knowledge bases (where the deployment has the knowledge module). Writes need an owner, admin or developer
  #    key made by an owner, admin or developer (deleting a base: made by an owner or admin). Rows are snake_case.
  #    A text document is embedded in the background (`status` pending → embedded, or failed with `error`);
  #    a table (CSV, JSON, XLSX) is indexed at once. ──
  /api/orgs/{orgId}/knowledge-bases:
    get:
      operationId: listKnowledgeBases
      summary: "The org's knowledge bases, newest first, with how many documents each holds."
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [knowledgeBases, total]
                    properties:
                      knowledgeBases: { type: array, items: { $ref: '#/components/schemas/KnowledgeBase' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createKnowledgeBase
      summary: 'Create a knowledge base.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
      responses:
        '201':
          description: Created (document_count null here)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/KnowledgeBase' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
  /api/orgs/{orgId}/knowledge-bases/{kbId}:
    get:
      operationId: getKnowledgeBase
      summary: 'One knowledge base.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/KnowledgeBase' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteKnowledgeBase
      summary: Delete a knowledge base — every agent stops answering from it.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/knowledge-bases/{kbId}/documents:
    get:
      operationId: listKnowledgeDocuments
      summary: "A base's documents (newest first), or with updatedAfter every document changed since — deletions included."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/KbId' }
        - { name: updatedAfter, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK — without updatedAfter KnowledgeDocumentSummary rows, with it KnowledgeDocumentChange rows.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [documents, total]
                    properties:
                      documents: { type: array, items: { $ref: '#/components/schemas/KnowledgeDocumentChange' } }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: addKnowledgeText
      summary: Add a text document (embedded in the background).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        '201': { $ref: '#/components/responses/KnowledgeDocumentAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
  /api/orgs/{orgId}/knowledge-bases/{kbId}/documents/upload:
    post:
      operationId: uploadKnowledgeFile
      summary: Add a file — PDF, DOCX, TXT or Markdown (embedded), or CSV, JSON or XLSX (indexed as a table). Up to 20 MB.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, description: 'Default: the file name.' }
      responses:
        '201': { $ref: '#/components/responses/KnowledgeDocumentAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/knowledge-bases/{kbId}/documents/url:
    post:
      operationId: addKnowledgeUrl
      summary: Add a web page (https, a public host, HTML or text, up to 5 MB), embedded in the background.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                title: { type: string, nullable: true, description: "Default: the page's title." }
      responses:
        '201': { $ref: '#/components/responses/KnowledgeDocumentAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
  /api/orgs/{orgId}/knowledge-bases/{kbId}/documents/{docId}:
    get:
      operationId: getKnowledgeDocument
      summary: One document with its text (the first 500,000 characters).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }, { $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/KnowledgeDocumentSummary' }
                      - type: object
                        required: [body, truncated]
                        properties:
                          body: { type: string }
                          truncated: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteKnowledgeDocument
      summary: 'Delete one document from a knowledge base.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }, { $ref: '#/components/parameters/DocId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/knowledge-bases/{kbId}/documents/{docId}/retry:
    post:
      operationId: retryKnowledgeDocument
      summary: Embed a failed document again.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }, { $ref: '#/components/parameters/DocId' }]
      responses:
        '200': { $ref: '#/components/responses/KnowledgeDocumentAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/knowledge-bases/{kbId}/documents/{docId}/dataset:
    get:
      operationId: getKnowledgeTable
      summary: "A table document's columns and size (data null for a text document)."
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }, { $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    nullable: true
                    required: [columns, rowCount, colCount, format, inlined, fuzzyTruncated, fuzzyRowCap]
                    properties:
                      columns: { type: array, items: { $ref: '#/components/schemas/KnowledgeColumn' } }
                      rowCount: { type: integer }
                      colCount: { type: integer }
                      format: { type: string, enum: [csv, json, xlsx] }
                      inlined: { type: boolean, description: 'Small enough to be put in the prompt whole.' }
                      fuzzyTruncated: { type: boolean }
                      fuzzyRowCap: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      operationId: setKnowledgeColumnTypes
      summary: Change the type of a table's columns (text, number, bool, date), by column sql_name.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/KbId' }, { $ref: '#/components/parameters/DocId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                types: { type: object, additionalProperties: { type: string, enum: [text, number, bool, date] } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
  /api/orgs/{orgId}/knowledge-bases/{kbId}/documents/{docId}/rows:
    get:
      operationId: listKnowledgeTableRows
      summary: "A table document's rows, a page at a time (data null for a text document)."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/KbId' }
        - { $ref: '#/components/parameters/DocId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    nullable: true
                    required: [columns, rows, rowCount, limit, offset]
                    properties:
                      columns: { type: array, items: { $ref: '#/components/schemas/KnowledgeColumn' } }
                      rows: { type: array, items: { type: object, additionalProperties: true, description: 'Keyed by column sql_name.' } }
                      rowCount: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ── The provider catalog (the same for every org) and provider tools: previews, the ElevenLabs voice library,
  #    a custom endpoint check. Provider tools need an owner, admin or developer key; previews meet the account's
  #    spend check and are throttled per org. ──
  /api/catalog:
    get:
      operationId: getCatalog
      summary: Every LLM, speech-to-text, text-to-speech and telephony provider Telenow offers, with models, voices and prices.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [llm, stt, tts, telephony, platformFee, features, promptContext]
                    properties:
                      llm: { type: array, items: { $ref: '#/components/schemas/CatalogProvider' } }
                      stt: { type: array, items: { $ref: '#/components/schemas/CatalogProvider' } }
                      tts: { type: array, items: { $ref: '#/components/schemas/CatalogProvider' } }
                      telephony: { type: array, items: { $ref: '#/components/schemas/CatalogProvider' } }
                      s2s: { type: array, items: { $ref: '#/components/schemas/CatalogProvider' }, description: 'Only where realtime voices are enabled.' }
                      platformFee:
                        type: object
                        required: [percent, perMinUsd, chatTurnBlockTurns, chatTurnBlockUsd, pulseSecs]
                        properties:
                          percent: { type: number }
                          perMinUsd: { type: number }
                          chatTurnBlockTurns: { type: integer }
                          chatTurnBlockUsd: { type: number }
                          pulseSecs: { type: integer }
                      features:
                        type: object
                        required: [providerFallback, s2s, exitGuidance, exitGuidanceVoice]
                        properties:
                          providerFallback: { type: boolean }
                          s2s: { type: boolean }
                          exitGuidance: { type: boolean }
                          exitGuidanceVoice: { type: boolean }
                      promptContext: { type: object, additionalProperties: true, description: "What the platform adds to every agent's prompt, and its size." }
        '401': { $ref: '#/components/responses/Error' }

  /api/catalog/s2s:
    get:
      operationId: getRealtimeCatalog
      summary: The realtime (speech-to-speech) voices, when this deployment offers them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [enabled, providers]
                    properties:
                      enabled: { type: boolean }
                      providers: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Error' }

  /api/catalog/openrouter-models:
    get:
      operationId: listOpenRouterModels
      summary: "OpenRouter's models (empty when it cannot be reached)."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, textToText]
                      properties:
                        id: { type: string }
                        name: { type: string, nullable: true }
                        textToText: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }

  /api/catalog/openrouter-price:
    get:
      operationId: getOpenRouterPrice
      summary: What Telenow charges per million tokens for an OpenRouter model.
      parameters:
        - { name: model, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK (found false when the model has no price).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [found]
                    properties:
                      found: { type: boolean }
                      modelKey: { type: string }
                      inputPerM: { type: number }
                      outputPerM: { type: number }
                      marginPercent: { type: number }
        '401': { $ref: '#/components/responses/Error' }

  /api/catalog/processing-country:
    get:
      operationId: getProcessingCountry
      summary: "The country the org's calls are processed for (from its country or time zone)."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [country, source]
                    properties:
                      country: { type: string, nullable: true }
                      source: { type: string, enum: [OrgCountry, OrgTimezone, Explicit, Unknown] }
        '401': { $ref: '#/components/responses/Error' }

  /api/providers/tts/{provider}/voices:
    get:
      operationId: listProviderVoices
      summary: "A text-to-speech provider's voices: Telenow's daily copy, ranked for a country, narrowed and paged on request."
      description: >-
        Open: it needs no credential, and an org API key is ignored. With your own vendor key in the
        x-provider-api-key header, your own account's voices are listed live from the vendor. Without one,
        only providers Telenow offers list anything, in this order: Telenow's daily copy of the provider's
        own list (origin "synced", ranked for the country), the vendor's live list (origin "live"), then
        Telenow's hand-picked list (origin "curated" — the only list for providers with no voice-listing
        API, such as Sarvam). A provider Telenow does not offer answers an empty list with offered false.
        `source` keeps its older meaning — "live" when the voices came from the provider, synced or live;
        "fallback" otherwise — so branch on `origin`. Without language, gender, search, page and pageSize
        the whole list comes back. The ElevenLabs shared library is browseVoiceLibrary.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string }, description: 'A provider id from getCatalog''s tts list, e.g. elevenlabs, cartesia, sarvam.' }
        - { name: model, in: query, required: false, schema: { type: string }, description: 'Only the voices for this model, for a provider whose voices differ per model (Sarvam bulbul:v2 / bulbul:v3, Rime).' }
        - { name: language, in: query, required: false, schema: { type: string }, description: 'Only voices that speak this language: a name or a code (Hindi, hi, hi-IN). That exact locale comes first. A language Telenow cannot read is a 400.' }
        - { name: gender, in: query, required: false, schema: { type: string }, description: 'female, male or neutral.' }
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Text found, ignoring case, in the id, name, description, accent, style, use case or tags.' }
        - { name: geo, in: query, required: false, schema: { type: string }, description: 'ISO 3166-1 alpha-2 country to rank for, over the one the request comes from.' }
        - { name: country, in: query, required: false, schema: { type: string }, description: 'A country guess, used only when the request carries none.' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 }, description: 'With page or pageSize, one page; with neither, every voice.' }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: x-provider-api-key, in: header, required: false, schema: { type: string }, description: 'Your own vendor key: lists your account live. Never sent in the URL.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, source, origin, data, totalCount, hasMore, page]
                properties:
                  success: { type: boolean, example: true }
                  source: { type: string, enum: [live, fallback], description: 'The older label: "live" when the voices came from the provider (synced or live), "fallback" otherwise.' }
                  origin: { type: string, enum: [synced, live, curated, none], description: 'synced = Telenow''s daily copy; live = the vendor answered now; curated = Telenow''s hand-picked list; none = no list.' }
                  offered: { type: boolean, description: 'Whether Telenow offers this provider. Absent when Telenow could not read its catalogue.' }
                  data: { type: array, items: { $ref: '#/components/schemas/TtsVoice' } }
                  totalCount: { type: integer, description: 'Voices matching the filters, before paging.' }
                  hasMore: { type: boolean }
                  page: { type: integer }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '429': { $ref: '#/components/responses/Error' }
  /api/providers/tts/{provider}/models:
    get:
      operationId: listProviderModels
      summary: "A multi-model text-to-speech provider's models (Telenow); an empty list for the rest."
      description: >-
        Open, like listProviderVoices. Your own vendor key in the x-provider-api-key header lists your
        account's models; without one, a provider Telenow does not offer lists none.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: x-provider-api-key, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, supportsCloning, languages, presetVoices, isDefault]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string }
                        supportsCloning: { type: boolean }
                        languages: { type: array, items: { type: string } }
                        presetVoices: { type: integer }
                        isDefault: { type: boolean }
        '429': { $ref: '#/components/responses/Error' }
  /api/providers/tts/{provider}/preview:
    post:
      operationId: previewVoice
      summary: A short WAV clip of a text-to-speech voice (on your key in `config.apiKey`, or Telenow's).
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 500 }
                voice: { type: string, nullable: true }
                config: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The clip.
          content:
            audio/wav: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/providers/s2s/{provider}/preview:
    post:
      operationId: previewRealtimeVoice
      summary: A short WAV clip of a realtime (speech-to-speech) voice — where realtime voices are enabled (404 otherwise).
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [openai, gemini, google] } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, voice]
              properties:
                model: { type: string }
                voice: { type: string }
                text: { type: string, nullable: true, maxLength: 200 }
                config: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The clip.
          content:
            audio/wav: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/providers/tts/{provider}/library:
    get:
      operationId: browseVoiceLibrary
      summary: "Browse ElevenLabs' shared voice library (other providers: an empty list)."
      description: >-
        Your key in the x-provider-api-key header, or Telenow's. Without your key, a provider Telenow does
        not offer answers an empty page with offered false.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: gender, in: query, required: false, schema: { type: string } }
        - { name: language, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string, enum: [professional, famous, high_quality] } }
        - { name: geo, in: query, required: false, schema: { type: string } }
        - { name: country, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: x-provider-api-key, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data, hasMore, totalCount, page]
                properties:
                  success: { type: boolean, example: true }
                  source: { type: string, description: '"synced" when served from Telenow''s copy of the library.' }
                  offered: { type: boolean, description: 'false when Telenow does not offer the provider (and you brought no key of your own).' }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        publicOwnerId: { type: string }
                        name: { type: string }
                        gender: { type: string, nullable: true }
                        accent: { type: string, nullable: true }
                        language: { type: string, nullable: true }
                        languages: { type: array, items: { type: string } }
                        age: { type: string, nullable: true }
                        category: { type: string, nullable: true }
                        description: { type: string, nullable: true }
                        previewUrl: { type: string, nullable: true }
                        clonedByCount: { type: integer, nullable: true }
                        freeUsersAllowed: { type: boolean, nullable: true }
                  hasMore: { type: boolean }
                  totalCount: { type: integer }
                  page: { type: integer }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/providers/tts/{provider}/library/add:
    post:
      operationId: addLibraryVoice
      summary: "Add a shared library voice to the ElevenLabs account (yours with `apiKey`, else Telenow's)."
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicOwnerId, voiceId]
              properties:
                publicOwnerId: { type: string }
                voiceId: { type: string }
                apiKey: { type: string, nullable: true }
                name: { type: string, nullable: true }
      responses:
        '200':
          description: Added (or already there)
          content:
            application/json:
              schema:
                type: object
                required: [success, voiceId]
                properties:
                  success: { type: boolean, example: true }
                  voiceId: { type: string }
                  already: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '502': { $ref: '#/components/responses/Error' }
  /api/providers/custom-endpoint/test:
    post:
      operationId: testCustomEndpoint
      summary: Try a custom speech endpoint (your own TTS or STT service) with its descriptor and key.
      description: Always 200 once the request is valid; whether the endpoint worked is in `ok` / `message` / `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [tts, stt] }
                config: { type: object, additionalProperties: true, description: '{apiKey, model, custom: <descriptor>}' }
                text: { type: string, nullable: true }
                voice: { type: string, nullable: true }
      responses:
        '200':
          description: The probe's result
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [ok, kind, message]
                    properties:
                      ok: { type: boolean }
                      kind: { type: string, enum: [tts, stt] }
                      message: { type: string }
                      firstMs: { type: integer }
                      frames: { type: integer }
                      bytes: { type: integer }
                      transcript: { type: string }
                      error: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  # ── Voice profiles (a recorded voice, with consent, cloned into providers) and favourite voices. Writes need an
  #    owner, admin or developer key; profile writes also a key made by an owner, admin or developer. Profile rows
  #    are snake_case. ──
  /api/orgs/{orgId}/voices:
    get:
      operationId: listVoiceProfiles
      summary: 'The org''s voice profiles.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [voices, total]
                    properties:
                      voices: { type: array, items: { $ref: '#/components/schemas/VoiceProfile' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createVoiceProfile
      summary: Create a voice profile for someone who agreed to have their voice cloned (then upload a sample).
      description: >-
        With a key, the subject cannot be "self": name them (employee, voice_actor, customer, other)
        with subject_name and subject_confirmed true (you hold their signed release). Fields are snake_case.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, consent, subject_relation]
              properties:
                name: { type: string }
                consent: { type: boolean }
                subject_relation: { type: string, enum: [self, employee, voice_actor, customer, other] }
                subject_name: { type: string, nullable: true }
                subject_confirmed: { type: boolean, default: false }
                source_language: { type: string, nullable: true }
                sample_script: { type: string, nullable: true }
                source_kind: { type: string, enum: [upload, record], nullable: true }
                consent_text_version: { type: string, nullable: true }
                retention_days: { type: integer, minimum: 0, nullable: true, description: 'Delete the voiceprint after this many days (0: keep).' }
      responses:
        '201': { $ref: '#/components/responses/VoiceProfileAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
  /api/orgs/{orgId}/voices/{voiceId}:
    get:
      operationId: getVoiceProfile
      summary: 'One voice profile.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/VoiceId' }]
      responses:
        '200': { $ref: '#/components/responses/VoiceProfileAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteVoiceProfile
      summary: Delete a profile and its clones (at the provider too, where Telenow holds the key).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/VoiceId' }]
      responses:
        '200': { $ref: '#/components/responses/CloneRemoval' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/voices/{voiceId}/sample:
    get:
      operationId: downloadVoiceSample
      summary: "The profile's recorded sample, as uploaded."
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/VoiceId' }]
      responses:
        '200':
          description: The audio
          content:
            audio/*: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: uploadVoiceSample
      summary: Upload the voice sample (at least 3 seconds; 10–15 s of clear speech is best; up to 25 MB).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/VoiceId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'WAV, MP3, OGG, WebM, …' }
                seconds: { type: number }
                kind: { type: string, enum: [upload, record] }
                script: { type: string }
      responses:
        '200': { $ref: '#/components/responses/VoiceProfileAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/voices/clone-preflight:
    post:
      operationId: checkVoiceCloning
      summary: Whether a provider can clone a voice on the given key (or Telenow's), and its limits.
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloneTarget' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [supported]
                    properties:
                      supported: { type: boolean }
                      reason: { type: string, nullable: true, description: 'bad_key, no_entitlement, slots_full, key_rotation.' }
                      detail: { type: string, nullable: true }
                      caps:
                        type: object
                        required: [instant, languages]
                        properties:
                          instant: { type: boolean }
                          min_secs: { type: integer }
                          max_secs: { type: integer }
                          cross_lingual: { type: boolean }
                          languages: { type: array, items: { type: string } }
                          region_note: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '502': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/voices/{voiceId}/clone:
    post:
      operationId: cloneVoice
      summary: Clone the profile's voice into a provider (on your key with `apiKey`, else Telenow's — 50 per org).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/VoiceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloneTarget' } } }
      responses:
        '200':
          description: Cloned
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/VoiceClone' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '502': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/voices/{voiceId}/clone/{provider}/remove:
    post:
      operationId: removeVoiceClone
      summary: Remove the profile's clone from a provider (send the same `apiKey` it was cloned with, or {}).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/VoiceId' }
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/CloneRemoval' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/voices/{voiceId}/clones:
    get:
      operationId: listVoiceClones
      summary: 'The clones made from one voice profile.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/VoiceId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [clones]
                    properties:
                      clones: { type: array, items: { $ref: '#/components/schemas/VoiceClone' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/voices/clones:
    get:
      operationId: listReadyClones
      summary: "The org's ready clones on one provider — the voices an agent on that provider can use."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: provider, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [clones]
                    properties:
                      clones:
                        type: array
                        items:
                          type: object
                          required: [voice_profile_id, profile_name, provider, provider_voice_id, key_scope, languages]
                          properties:
                            voice_profile_id: { type: string, format: uuid }
                            profile_name: { type: string }
                            provider: { type: string }
                            provider_voice_id: { type: string }
                            key_scope: { type: string, enum: [platform, byok] }
                            languages: {}
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/voices/favourites:
    get:
      operationId: listFavouriteVoices
      summary: "Voices the org's members starred (yours first, then the most starred)."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: provider, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/FavouriteVoices' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      operationId: starVoice
      summary: "Star a voice (for the key's creator)."
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, voiceId]
              properties:
                provider: { type: string }
                voiceId: { type: string }
                voiceName: { type: string, nullable: true }
                model: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/FavouriteVoices' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
    delete:
      operationId: unstarVoice
      summary: 'Remove a voice from the org''s favourites.'
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: provider, in: query, required: true, schema: { type: string } }
        - { name: voiceId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/FavouriteVoices' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/voices/lookup:
    get:
      operationId: lookUpVoice
      summary: "A voice's name and details from its provider id (null when it cannot be found)."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: provider, in: query, required: true, schema: { type: string } }
        - { name: voiceId, in: query, required: true, schema: { type: string } }
        - { name: x-provider-api-key, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [voice]
                    properties:
                      voice:
                        type: object
                        nullable: true
                        required: [id, name]
                        properties:
                          id: { type: string }
                          name: { type: string }
                          language: { type: string }
                          gender: { type: string }
                          previewUrl: { type: string }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }

  # ── Webhook endpoints (the org's own receivers). Rows are snake_case; the signing secret is shown once. Sending a
  #    test event or a replay needs an owner or admin key made by an owner or admin. ──
  /api/orgs/{orgId}/webhooks:
    get:
      operationId: listWebhookEndpoints
      summary: 'The org''s webhook endpoints.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK (active endpoints, newest first)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [endpoints, total]
                    properties:
                      endpoints: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWebhookEndpoint
      summary: Add a receiver (https, a public host) for some events (default every event).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                events: { type: array, items: { type: string }, default: ['*'] }
                agentId: { type: string, format: uuid, nullable: true, description: 'Only this agent''s events.' }
                includeRecording: { type: boolean, default: false }
                includeTranscript: { type: boolean, default: false }
      callbacks:
        callCompleted:
          '{$request.body#/url}':
            post:
              summary: 'call.completed — what Telenow sends when a call finishes (one per call).'
              description: >-
                Signed: `X-VoiceAI-Signature: sha256=<hex>` is the HMAC-SHA256 of the raw body under the
                endpoint's signing secret; `X-VoiceAI-Event` names the event and `X-VoiceAI-Delivery` the
                delivery (the same id on every retry). Every other event has its own body — read one with
                GET /api/v1/events/sample.
              requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/CallCompletedEvent' } } }
              responses:
                '2XX': { description: 'Delivered. Any other answer, or none, is retried.' }
      responses:
        '201':
          description: Added — keep `signing_secret`, it is not shown again.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [endpoint, signing_secret]
                    properties:
                      endpoint: { $ref: '#/components/schemas/WebhookEndpoint' }
                      signing_secret: { type: string, description: 'Signs each delivery (X-VoiceAI-Signature: sha256=<HMAC of the body>).' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
  /api/orgs/{orgId}/webhooks/{id}:
    delete:
      operationId: disableWebhookEndpoint
      summary: Stop sending to a receiver (its delivery history stays readable).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/WebhookId' }]
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: 'One endpoint''s deliveries, newest first.'
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/WebhookId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK (newest first; total counts this page)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [deliveries, total]
                    properties:
                      deliveries: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/webhooks/{id}/deliveries/{deliveryId}:
    get:
      operationId: getWebhookDelivery
      summary: 'One delivery, with what the endpoint answered.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/WebhookId' }, { $ref: '#/components/parameters/DeliveryId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [delivery]
                    properties:
                      delivery: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/webhooks/{id}/deliveries/{deliveryId}/replay:
    post:
      operationId: replayWebhookDelivery
      summary: Send a finished delivery again (one Idempotency-Key per attempt).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/WebhookId' }
        - { $ref: '#/components/parameters/DeliveryId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '202': { $ref: '#/components/responses/WebhookManualSend' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/webhooks/{id}/test:
    post:
      operationId: sendWebhookTest
      summary: Send a sample of one event to the receiver.
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/WebhookId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              additionalProperties: false
              properties:
                eventType: { type: string, example: call.completed }
      responses:
        '202': { $ref: '#/components/responses/WebhookManualSend' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ErrorOrBadBody' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ── Bulk call exports: a ZIP of calls.csv, transcripts and recordings for a time range, built in the background.
  #    Needs an owner or admin key made by an owner or admin. ──
  /api/orgs/{orgId}/call-exports:
    get:
      operationId: listCallExports
      summary: 'The org''s call exports, newest first.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK (in progress or within the retention period, newest first)
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: '#/components/schemas/CallExport' } }
                  meta:
                    type: object
                    required: [retentionDays]
                    properties:
                      retentionDays: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: startCallExport
      summary: Start an export of the calls in a time range (one at a time per org).
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallExportFilters' } } }
      responses:
        '200': { $ref: '#/components/responses/CallExportAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/call-exports/preview:
    get:
      operationId: previewCallExport
      summary: How many calls and recordings an export of this range would hold.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: campaignId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [calls, recordings, recordingBytes, from, to]
                    properties:
                      calls: { type: integer }
                      recordings: { type: integer }
                      recordingBytes: { type: integer }
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/call-exports/{id}:
    get:
      operationId: getCallExport
      summary: 'One call export and its parts.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallExportId' }]
      responses:
        '200': { $ref: '#/components/responses/CallExportAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCallExportFiles
      summary: "Delete a ready export's files now (rather than at its expiry)."
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallExportId' }]
      responses:
        '200': { $ref: '#/components/responses/CallExportAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/call-exports/{id}/cancel:
    post:
      operationId: cancelCallExport
      summary: 'Cancel a call export that has not finished.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/CallExportId' }]
      responses:
        '200': { $ref: '#/components/responses/CallExportAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/call-exports/{id}/parts/{n}/link:
    post:
      operationId: linkCallExportPart
      summary: A 5-minute download link for one part of a ready export (`url` on object storage, else `path` under /api).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/CallExportId' }
        - { name: n, in: path, required: true, description: 'Part number, from 1.', schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [url, path, expiresInSecs, name, bytes, sha256]
                    properties:
                      url: { type: string, nullable: true }
                      path: { type: string, nullable: true }
                      expiresInSecs: { type: integer }
                      name: { type: string }
                      bytes: { type: integer, nullable: true }
                      sha256: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  # ── Sub-accounts from the dashboard routes: the same answers as /api/v1/sub-accounts, inside {success, data}.
  #    Needs an owner or admin key made by an owner or admin, of the parent account. Money is a number here. ──
  /api/orgs/{orgId}/sub-accounts:
    get:
      operationId: listSubAccountsOfOrg
      summary: 'List this org''s sub-accounts, newest first.'
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, suspended, closed] } }
        - { name: externalId, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [subAccounts, total, limit, offset]
                    properties:
                      subAccounts: { type: array, items: { $ref: '#/components/schemas/SubAccount' } }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSubAccountOfOrg
      summary: 'Create a sub-account — returns it AND its own API key (shown once).'
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSubAccountRequest' } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [subAccount, apiKey]
                    properties:
                      subAccount: { $ref: '#/components/schemas/SubAccount' }
                      apiKey: { $ref: '#/components/schemas/SubAccountKey' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/sub-accounts/{id}:
    get:
      operationId: getSubAccountOfOrg
      summary: 'One sub-account, with month-to-date spend and live calls.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/SubAccountId' }]
      responses:
        '200': { $ref: '#/components/responses/SubAccountAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSubAccountOfOrg
      summary: 'Rename a sub-account, set its externalId, change its limits.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/SubAccountId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSubAccountRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/SubAccountAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: closeSubAccountOfOrg
      summary: Close a sub-account for good (its keys stop working; release its numbers first).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/SubAccountId' }]
      responses:
        '200': { $ref: '#/components/responses/SubAccountAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/sub-accounts/{id}/suspend:
    post:
      operationId: suspendSubAccountOfOrg
      summary: 'Refuse a sub-account''s new calls and end its live ones.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/SubAccountId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, nullable: true, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/SubAccountAnswer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/sub-accounts/{id}/resume:
    post:
      operationId: resumeSubAccountOfOrg
      summary: 'Lift a sub-account''s suspension.'
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/SubAccountId' }]
      responses:
        '200': { $ref: '#/components/responses/SubAccountAnswer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/sub-accounts/{id}/keys:
    post:
      operationId: mintSubAccountKeyOfOrg
      summary: Mint a new key for a sub-account (by default its other keys are revoked).
      parameters: [{ $ref: '#/components/parameters/OrgId' }, { $ref: '#/components/parameters/SubAccountId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keyName: { type: string, maxLength: 120 }
                keyRole: { type: string, enum: [admin, developer, viewer], default: admin }
                revokeExisting: { type: boolean, default: true }
      responses:
        '201':
          description: Minted
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [subAccountId, revokedKeys, apiKey]
                    properties:
                      subAccountId: { type: string, format: uuid }
                      revokedKeys: { type: integer }
                      apiKey: { $ref: '#/components/schemas/SubAccountKey' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/sub-accounts/{id}/usage:
    get:
      operationId: getSubAccountUsageOfOrg
      summary: 'A sub-account''s calls, billable seconds and spend for a window.'
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/SubAccountId' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/SubAccountUsage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ── Reporting. ──
  /api/orgs/{orgId}/analytics:
    get:
      operationId: getCallAnalytics
      summary: Call totals for a date range (at most 366 days), by day and by agent.
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: from, in: query, required: false, description: 'YYYY-MM-DD (UTC); default 29 days before to.', schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: 'YYYY-MM-DD (UTC), inclusive; default today.', schema: { type: string, format: date } }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CallAnalyticsSummary' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/analysis/cost:
    get:
      operationId: getAnalysisCost
      summary: What post-call analysis cost the org in a window (default the last 30 days).
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [from, to, costUsd]
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      costUsd: { type: number }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/orgs/{orgId}/analysis/result/{sessionId}:
    get:
      operationId: getCallAnalysis
      summary: "A call's post-call analysis (data null when there is none yet)."
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { allOf: [{ $ref: '#/components/schemas/CallAnalysis' }], nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/sessions/queue:
    get:
      operationId: listAgentQueue
      summary: "Calls queued for an agent through the API (its targets and how each went)."
      parameters:
        - { name: agentId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [items, total]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/CampaignCall' } }
                      total: { type: integer }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------
  # /api/v1 — key-authed integration surface (Zapier / Make / n8n /
  # viaSocket). Org always comes from the API key; responses are FLAT
  # JSON (no {success,data} envelope).
  # ------------------------------------------------------------------
  # -- /api/v1: flat JSON (no success/data wrapper), the org from the key. Reads take any key;
  # writes need an owner, admin or developer key (a viewer key gets 403). A path id that is not a
  # UUID, a query value that does not parse, a body that is not JSON (400) or one with a missing or
  # mistyped field (422) is refused by the framework in plain text.

  /api/v1/me:
    get:
      operationId: whoAmI
      summary: Connection test — identifies the key's org.
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [org_id, org_name, key_id, key_name, key_role, parent_org_id]
                properties:
                  org_id: { type: string, format: uuid }
                  org_name: { type: string, nullable: true }
                  key_id: { type: string, format: uuid }
                  key_name: { type: string, nullable: true }
                  key_role: { type: string, enum: [owner, admin, developer, viewer], example: developer }
                  parent_org_id:
                    type: string
                    format: uuid
                    nullable: true
                    description: Set when the key's org is a sub-account - its calls are billed to this parent.
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/hooks:
    get:
      operationId: listHooks
      summary: List webhook subscriptions (REST hooks).
      description: The org's active hooks, newest first. The signing secret is never listed.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: source
          in: query
          required: false
          schema: { type: string, example: n8n }
          description: Only hooks registered by this platform label.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [hooks, total]
                properties:
                  hooks:
                    type: array
                    items: { $ref: '#/components/schemas/Hook' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createHook
      summary: Subscribe a target URL to webhook events (REST hooks).
      description: >
        No `events` (and no `event`) subscribes to every event (`["*"]`). The URL must be https and
        its host must resolve to a public address (cloud-metadata, loopback, link-local and private
        ranges are refused, 400). `agent_id` must be one of your agents (404 otherwise).
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHookRequest' }
      callbacks:
        callCompleted:
          '{$request.body#/target_url}':
            post:
              summary: 'call.completed — what Telenow sends when a call finishes (one per call).'
              description: >-
                Signed: `X-VoiceAI-Signature: sha256=<hex>` is the HMAC-SHA256 of the raw body under the
                endpoint's signing secret; `X-VoiceAI-Event` names the event and `X-VoiceAI-Delivery` the
                delivery (the same id on every retry). Every other event has its own body — read one with
                GET /api/v1/events/sample.
              requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/CallCompletedEvent' } } }
              responses:
                '2XX': { description: 'Delivered. Any other answer, or none, is retried.' }
      responses:
        '201':
          description: Subscribed. The signing secret is returned ONLY here (never in the list endpoint).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HookCreated' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }

  /api/v1/hooks/{id}:
    delete:
      operationId: deleteHook
      summary: Unsubscribe (idempotent — already-gone returns deleted=false).
      description: An unknown id, another organization's hook or one already removed answers 200 with `deleted:false`.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string, format: uuid }
                  deleted: { type: boolean }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/agents:
    get:
      operationId: listAgentsSlim
      summary: Slim agent list (ids + labels, for dropdowns).
      description: Your agents, deleted ones and internal stubs left out.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { name: is_active, in: query, description: 'Also read as `isActive` or `active`.', schema: { type: boolean } }
        - { name: limit, in: query, description: 'Clamped to 1–200 (not an error).', schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [agents, total]
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      required: [id, name, description, is_active, created_at, updated_at]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        description: { type: string, nullable: true }
                        is_active: { type: boolean }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/numbers:
    get:
      operationId: listNumbersSlim
      summary: Owned phone numbers (slim).
      description: >-
        Held numbers by default. includeReleased=true adds released ones (released_at set);
        updatedAfter returns only numbers changed after that instant (exclusive), released ones
        included. Each row carries updated_at and released_at.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { name: includeReleased, in: query, schema: { type: boolean, default: false } }
        - { name: updatedAfter, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [numbers, total]
                properties:
                  numbers:
                    type: array
                    items:
                      type: object
                      required: [id, phone_number, provider, country, agent_id, is_active, updated_at, released_at]
                      properties:
                        id: { type: string, format: uuid }
                        phone_number: { type: string, example: '+14155550123' }
                        provider: { type: string, example: twilio }
                        country: { type: string, nullable: true, example: US }
                        agent_id: { type: string, format: uuid, nullable: true }
                        is_active: { type: boolean }
                        updated_at: { type: string, format: date-time }
                        released_at: { type: string, format: date-time, nullable: true }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/calls:
    get:
      operationId: listCallsV1
      summary: Call history, newest first.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { name: agent_id, in: query, description: 'Also read as `agentId`.', schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, example: ended } }
        - { name: sort, in: query, description: 'Anything else reads as `newest` (not an error).', schema: { type: string, enum: [newest, oldest, longest, shortest] } }
        - { name: limit, in: query, description: 'Clamped to 1–200 (not an error).', schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - name: updatedAfter
          in: query
          description: >-
            Start a "changed since" feed - calls changed after this instant (exclusive), oldest
            change first, ordered by (updated_at, id). Not combinable with agent_id, status, sort
            or offset (400).
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          description: Resume a feed exactly after the last call of the previous page (its nextCursor). Not with updatedAfter.
          schema: { type: string }
      responses:
        '200':
          description: >-
            `{ calls, total }` — with updatedAfter/cursor: `{ calls, total: null, nextCursor }`.
          content:
            application/json:
              schema:
                type: object
                required: [calls, total]
                properties:
                  calls:
                    type: array
                    items: { $ref: '#/components/schemas/CallV1' }
                  total: { type: integer, nullable: true, description: 'Null in feed mode.' }
                  nextCursor: { type: string, description: 'Feed mode: send it back as `cursor`.' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/calls/{id}:
    get:
      operationId: getCallV1
      summary: One call, including its transcript.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: The call, with its transcript and the agents on it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallV1Detail' }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/chat:
    post:
      operationId: chatSend
      summary: Send one text-chat turn to an agent (creates the session on the first call).
      description: >
        Text conversation with an agent — same brain, knowledge bases (RAG) and
        HTTP tools as a voice call, no audio. Omit `sessionId` on the first turn
        (the response returns one); pass it on follow-ups. Flat JSON. A `410`
        means the session expired — resend the same message WITHOUT `sessionId`.
        A `409` means a reply is still generating — wait, then retry. Any key may
        chat, a viewer key included. If the model cannot be reached the turn still
        answers 200, with an apology as the `reply`; a provider that cannot be set
        up at all (no key configured) is a 502.
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Agent reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: A reply is still generating; retry.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, example: turn in progress }
        '410':
          description: The session expired — resend without sessionId.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: { type: string, example: session expired }
                  code: { type: string, enum: [SESSION_EXPIRED] }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/v1/chat/{id}/messages:
    get:
      operationId: chatMessages
      summary: Full user/assistant transcript of a chat session.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Transcript
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatTranscript' }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/chat/{id}/end:
    post:
      operationId: chatEnd
      summary: End a chat session (idempotent) — settles billing + triggers analysis.
      description: A session that is not a chat-API session is 404, like an unknown one.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, ended]
                properties:
                  sessionId: { type: string, format: uuid }
                  ended: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/events/sample:
    get:
      operationId: sampleEvent
      summary: Latest real payload for an event type (canned dummy if none).
      description: >-
        `is_real` is false when the org has no delivery of that event yet and the sample is a canned
        one. Each sample is the event's payload as a webhook receives it (see the Webhooks section).
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: type
          in: query
          required: true
          description: Also read as `event`.
          schema:
            type: string
            enum: [call.started, call.ended, call.completed, call.machine_detected, call.dtmf, transcript.ready, tool.invoked, recording.ready, call.analyzed, whatsapp.message.received, whatsapp.message.status, whatsapp.account.health, billing.invoice_issued, billing.payment_overdue, billing.account_suspended, billing.number_renewal_due, billing.number_renewed, billing.number_renewal_failed, billing.number_release_pending, billing.number_released_nonpayment, billing.spend_state_changed]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [event_type, is_real, samples]
                properties:
                  event_type: { type: string }
                  is_real: { type: boolean }
                  samples:
                    type: array
                    items:
                      type: object
                      required: [event]
                      additionalProperties: true
                      properties:
                        event: { type: string, example: call.ended }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }

  # -- Integration connectors ------------------------------------------------
  # Connect a vendor account (a store, a CRM, a database, WhatsApp) to this org
  # so agents can use it mid-call. Secrets are WRITE-ONLY: accepted on create
  # and update, returned only ever as a fixed mask.

  /api/v1/integrations/providers:
    get:
      operationId: listConnectors
      summary: Connectors you can connect through this API.
      description: >
        Each entry carries `connect.credentials` and `connect.settings` - the
        exact fields to send when creating a connection. Connectors provisioned
        by a dashboard flow of their own are omitted, because a credentials body
        cannot set them up.
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/Connector' } }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/integrations/providers/{providerId}:
    get:
      operationId: getConnector
      summary: One connector's connect spec.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, example: shopify } }
      responses:
        '200':
          description: The connector
          content: { application/json: { schema: { $ref: '#/components/schemas/Connector' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/integrations/connections:
    get:
      operationId: listConnections
      summary: This org's connections (secrets masked).
      description: >
        Filter by `providerId` to find a connection whose id you no longer hold
        - a reinstalled app, a rebuilt worker - instead of creating a second one.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { name: providerId, in: query, schema: { type: string, example: shopify } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createConnection
      summary: Connect a vendor account.
      description: >
        Verifies the credentials against the vendor before returning, unless
        `verify` is false. A failed verification still returns 201: the
        connection exists and holds your credentials, so retrying the create
        would only make a second broken one. Read `verification.ok`, and the
        connection's own `status` / `lastError`.
        A workspace may connect one connector several times, but not twice to the
        same ACCOUNT - a second Shopify connection for the same store domain is
        refused with 409, and the message names the connection already holding it
        so a retry can PATCH that one. Connectors with no account identifier
        (razorpay, hubspot, ...) and OAuth connectors are unconstrained.
        Send an `Idempotency-Key` header anyway: the 409 tells you a duplicate
        happened, it does not make the retry succeed. With the header a retry of
        the same body replays the original 201 and its connection id.
        A connector this API cannot connect is 404; a missing credential or setting is 400.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequest' }
      responses:
        '201':
          description: Connected (whatever the verification found).
          content:
            application/json:
              schema:
                type: object
                required: [connection, verification, next]
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
                  verification: { allOf: [{ $ref: '#/components/schemas/ConnectionVerification' }], nullable: true, description: 'Null when not verified (`verify: false`, or an OAuth connector).' }
                  next: { type: string, nullable: true, description: 'OAuth connectors: the call that gets the consent URL.' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/integrations/connections/{id}:
    get:
      operationId: getConnection
      summary: One connection (secrets masked).
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '200': { $ref: '#/components/responses/ConnectionAnswer' }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateConnection
      summary: Update a connection (rotate a credential, rename, retarget).
      description: >
        Partial. An omitted field keeps its stored value, and a credential sent
        back as the mask keeps the stored secret - so you can read a connection,
        change one setting and send it back. Re-verifies by default (not an OAuth
        connection). `providerId` cannot change (400); delete it and connect the
        other one instead. Repointing at a different account is allowed, and 409s
        if another connection already holds that one.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequest' }
      responses:
        '200': { $ref: '#/components/responses/ConnectionUpdated' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
    put:
      operationId: replaceConnection
      summary: Alias of PATCH, with the same partial semantics.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequest' }
      responses:
        '200': { $ref: '#/components/responses/ConnectionUpdated' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/BadBody' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteConnection
      summary: Disconnect.
      description: >
        Refused with 409 while an agent or a WhatsApp channel still uses it, and
        the message names them. That guard is not cosmetic - deleting a
        connection cascades its WhatsApp channel and every message on it.
        Not idempotent: deleting it again is 404.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/integrations/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Re-run the connector's verification call.
      description: >
        Makes a real request to the vendor with the stored credentials and
        records the result on the connection. Returns 200 whether or not the
        credentials work - the answer is in `ok`. A connector with no
        verification call (an OAuth one, a custom HTTP source) answers ok.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '200':
          description: What the vendor said
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionVerification' } } }
        '400': { $ref: '#/components/responses/BadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/integrations/connections/{id}/authorize:
    post:
      operationId: authorizeConnection
      summary: OAuth connectors - get the consent URL.
      description: >
        For `authKind: oauth2` only (another connection is 400). Redirect your END USER to `authorizeUrl`;
        after they consent the vendor returns them to the Telenow dashboard
        (`returnsTo`), not to your app - there is no return-URL parameter, by
        design. Poll `pollUrl` until the connection's `status` is `active`.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '200':
          description: The consent URL
          content:
            application/json:
              schema:
                type: object
                required: [authorizeUrl, returnsTo, pollUrl]
                properties:
                  authorizeUrl: { type: string, format: uri }
                  returnsTo: { type: string }
                  pollUrl: { type: string, description: "This connection's GET URL." }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------
  # Sub-accounts — organizations this org creates for its own customers
  # and pays for. owner/admin keys only; a sub-account's key gets 403.
  # The same operations exist on /api/orgs/{orgId}/sub-accounts (JWT or
  # key, {success,data} envelope).
  # ------------------------------------------------------------------
  /api/v1/sub-accounts:
    get:
      operationId: listSubAccounts
      summary: List this org's sub-accounts, newest first.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, suspended, closed] } }
        - { name: externalId, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, description: 'Clamped to 1–200 (not an error); the response echoes the value used.', schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, description: 'A negative value is read as 0.', schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subAccounts: { type: array, items: { $ref: '#/components/schemas/SubAccount' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSubAccount
      summary: Create a sub-account — returns it AND its own API key (shown once).
      description: >
        Quiet creation: no signup emails, OTPs or welcome credit. Every charge the
        sub-account causes is posted to this org's wallet. Unknown fields are
        rejected (400). The returned key acts as the sub-account's own service
        identity (a user nobody can sign in as, a member of that sub-account only).
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSubAccountRequest' } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  subAccount: { $ref: '#/components/schemas/SubAccount' }
                  apiKey: { $ref: '#/components/schemas/SubAccountKey' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/sub-accounts/{id}:
    get:
      operationId: getSubAccount
      summary: One sub-account, with month-to-date spend and live calls.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SubAccountId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSubAccount
      summary: Rename, set externalId (null clears), change limits.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SubAccountId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSubAccountRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: closeSubAccount
      summary: Close for good — keys revoked, calls refused and ended, workspace deleted.
      description: >
        Refused (409) while the sub-account still holds phone numbers. Idempotent - closing a
        closed one is 200 and finishes a clean-up that was interrupted. Its externalId is free
        for a new sub-account afterwards.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SubAccountId' }]
      responses:
        '200': { description: The closed sub-account, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/sub-accounts/{id}/suspend:
    post:
      operationId: suspendSubAccount
      summary: Refuse every new call and end the live ones.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SubAccountId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/sub-accounts/{id}/resume:
    post:
      operationId: resumeSubAccount
      summary: Lift a suspension.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SubAccountId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/sub-accounts/{id}/usage:
    get:
      operationId: getSubAccountUsage
      summary: Calls, billable seconds and spend for a window (default — this billing month).
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/SubAccountId' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccountUsage' } } } }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/sub-accounts/{id}/keys:
    post:
      operationId: rotateSubAccountKey
      summary: Mint a new key for the sub-account (revokes its other keys unless revokeExisting is false).
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SubAccountId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keyName: { type: string, maxLength: 120 }
                keyRole: { type: string, enum: [admin, developer, viewer], default: admin }
                revokeExisting: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  subAccountId: { type: string, format: uuid }
                  revokedKeys: { type: integer }
                  apiKey: { $ref: '#/components/schemas/SubAccountKey' }
        '400': { $ref: '#/components/responses/ErrorOrBadBody' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ── Billing, by an owner/admin org API key (the key's own role is checked; a developer or
  #    viewer key gets 403). Paying, topping up and promotions stay in the dashboard. ──
  /api/orgs/{orgId}/billing/summary:
    get:
      operationId: getBillingSummary
      summary: The account's mode, balance, cap and this month's spend, and whether Telenow lets it spend right now.
      description: >-
        `spendState` is the same check a new call meets. Read with a sub-account's own key, the
        wallet fields are empty and `spendState` is null: the wallet is its parent's.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/BillingSummary' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/billing/spend-alert:
    put:
      operationId: setSpendAlert
      summary: Set or clear the low-balance threshold that turns spendState to `low`.
      description: >-
        The state is `low` while `headroomUsd` is at or below the threshold. Telenow sets none of
        its own. A top-level account only (a sub-account gets 403). Answers with the spend state it
        gives now.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [thresholdUsd]
              properties:
                thresholdUsd: { type: number, minimum: 0, nullable: true, description: 'USD; null clears it.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/SpendState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/billing/ledger:
    get:
      operationId: listLedger
      summary: Ledger entries — a page (newest first), or with updatedAfter / cursor every entry after a point (oldest first).
      description: >-
        Entries are never changed or removed (a correction is a new entry), so a stored
        `nextCursor` never misses or repeats one. With a sub-account's key: the entries it caused
        (calls, number setup and rent), `balanceAfterUsd` null; its `charge` entries for a month
        add up to that month's usage `spendUsd`.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, description: 'Page mode only.', schema: { type: integer, minimum: 0, default: 0 } }
        - { name: updatedAfter, in: query, required: false, description: 'Feed mode: entries created after this instant (exclusive).', schema: { type: string, format: date-time } }
        - { name: cursor, in: query, required: false, description: "Feed mode: a nextCursor this route returned. Not with updatedAfter.", schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/LedgerPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/billing/breakdown:
    get:
      operationId: getChargeBreakdown
      summary: Settled charges by agent and call type, with each component, for a window (default — this billing month).
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      rows: { type: array, items: { type: object, additionalProperties: true } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/orgs/{orgId}/billing/invoices:
    get:
      operationId: listInvoices
      summary: The account's invoices (postpaid), each with its lines.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        invoice: { type: object, additionalProperties: true }
                        lines: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      description: Ephemeral client token (or user JWT).
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Your organization's id — the one the key belongs to (a key for another org gets 403).
      schema: { type: string, format: uuid }
    SubAccountId:
      name: id
      in: path
      required: true
      description: The sub-account's organization id.
      schema: { type: string, format: uuid }
    ConnectionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentIdInOrg:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentVersionNumber:
      name: version
      in: path
      required: true
      description: A version number from listAgentVersions.
      schema: { type: integer, minimum: 1 }
    KbId:
      name: kbId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallId:
      name: id
      in: path
      required: true
      description: The call (session) id.
      schema: { type: string, format: uuid }
    RecordingId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookId:
      name: id
      in: path
      required: true
      description: The webhook endpoint's id.
      schema: { type: string, format: uuid }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallExportId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VoiceId:
      name: voiceId
      in: path
      required: true
      description: The voice profile's id.
      schema: { type: string, format: uuid }
    DocId:
      name: docId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NumberId:
      name: id
      in: path
      required: true
      description: The number's id (not the number itself).
      schema: { type: string, format: uuid }
    AgentView:
      name: view
      in: query
      required: false
      description: '`edit` returns provider keys in plaintext — honoured only for an owner or admin key; others get them masked.'
      schema: { type: string, enum: [edit] }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Done:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [success, message]
            properties:
              success: { type: boolean, example: true }
              message: { type: string }
    CampaignAnswer:
      description: The campaign as it is now.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data: { $ref: '#/components/schemas/Campaign' }
    CampaignV1Answer:
      description: The campaign as it is now (flat).
      content:
        application/json:
          schema:
            type: object
            required: [campaign]
            properties:
              campaign: { $ref: '#/components/schemas/Campaign' }
    TargetsAdded:
      description: Added
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                required: [added, suppressed]
                properties:
                  added: { type: integer }
                  suppressed: { type: integer, description: 'On the do-not-call list, or already pending.' }
    SourceSynced:
      description: Read
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                required: [added, suppressed, skipped, malformed, duplicates, hasMore]
                properties:
                  added: { type: integer }
                  suppressed: { type: integer }
                  skipped: { type: integer }
                  malformed: { type: integer, description: 'Rows whose phone could not be read as a number.' }
                  duplicates: { type: integer }
                  hasMore: { type: boolean, description: 'The read stopped at its cap; the next sync continues.' }
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success: { type: boolean, example: true }
    WebhookManualSend:
      description: Queued — it is sent within seconds; follow it in the deliveries.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                required: [delivery, deduplicated]
                properties:
                  deduplicated: { type: boolean, description: 'The same Idempotency-Key was already sent; this is that send.' }
                  delivery:
                    type: object
                    required: [id, endpointId, eventType, status, deliveryKind, replayOf, attempt, createdAt]
                    properties:
                      id: { type: string, format: uuid }
                      endpointId: { type: string, format: uuid, nullable: true }
                      eventType: { type: string }
                      status: { type: string }
                      deliveryKind: { type: string, nullable: true, enum: [test, replay] }
                      replayOf: { type: string, format: uuid, nullable: true }
                      attempt: { type: integer }
                      createdAt: { type: string, format: date-time }
    CallExportAnswer:
      description: The export as it is now.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data: { $ref: '#/components/schemas/CallExport' }
    SubAccountAnswer:
      description: The sub-account.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data: { $ref: '#/components/schemas/SubAccount' }
    VoiceProfileAnswer:
      description: The voice profile.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data: { $ref: '#/components/schemas/VoiceProfile' }
    CloneRemoval:
      description: Removed here; `vendorDeleted` false and `vendorDeleteFailures` name any copy left at a provider (for example one cloned on your own key).
      content:
        application/json:
          schema:
            type: object
            required: [success, vendorDeleted, vendorDeleteFailures]
            properties:
              success: { type: boolean, example: true }
              vendorDeleted: { type: boolean }
              vendorDeleteFailures:
                type: array
                items:
                  type: object
                  required: [provider, vendorLabel, keyScope, reason, vendorStatus, recordId]
                  properties:
                    provider: { type: string }
                    vendorLabel: { type: string }
                    keyScope: { type: string, enum: [platform, byok] }
                    reason: { type: string, enum: [vendor_refused, vendor_unreachable, vendor_error, vendor_not_configured, customer_key_not_held] }
                    vendorStatus: { type: integer, nullable: true }
                    recordId: { type: string, format: uuid }
    FavouriteVoices:
      description: The favourites (for the provider asked about, or all).
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                required: [favourites]
                properties:
                  favourites: { type: array, items: { $ref: '#/components/schemas/FavouriteVoice' } }
    KnowledgeDocumentAnswer:
      description: The document (its full text in body).
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data: { $ref: '#/components/schemas/KnowledgeDocument' }
    NumberAnswer:
      description: The number as it is now.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data: { $ref: '#/components/schemas/PhoneNumber' }
    RecordingAudio:
      description: The audio, with the type it was stored as (Content-Disposition inline).
      content:
        audio/*: { schema: { type: string, format: binary } }
    SignedUrl:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
    ConnectionAnswer:
      description: The connection
      content:
        application/json:
          schema:
            type: object
            required: [connection]
            properties:
              connection: { $ref: '#/components/schemas/Connection' }
    ConnectionUpdated:
      description: Updated
      content:
        application/json:
          schema:
            type: object
            required: [connection, verification]
            properties:
              connection: { $ref: '#/components/schemas/Connection' }
              verification: { allOf: [{ $ref: '#/components/schemas/ConnectionVerification' }], nullable: true }
    ErrorOrBadBody:
      description: Refused — JSON for a value the route checks, plain text for one that does not parse.
      content:
        application/json:
          schema:
            type: object
            required: [success, error]
            additionalProperties: true
            properties:
              success: { type: boolean, example: false }
              error: { type: string }
        text/plain:
          schema: { type: string }
    BadBody:
      description: The request does not match the documented shape (a missing or mistyped field, a bad query or path value). Plain text.
      content:
        text/plain:
          schema: { type: string }
  schemas:
    ErrorBody:
      type: object
      required: [success, error]
      additionalProperties: true
      description: >-
        Some errors add a machine-readable `code` (e.g. `provider_error` on a 502,
        `agent_version_conflict` on a 409) and details beside it (`currentVersion`, `path`).
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code: { type: string }
        retryAfter: { type: integer, description: 'On a 429: seconds to wait (also the Retry-After header).' }
    SpendState:
      type: object
      description: >-
        Whether Telenow lets the account spend right now (the check a new call meets), why not, and
        how much it can still spend. Prepaid or postpaid is the account's own setting. Money is USD,
        as decimal strings.
      properties:
        state: { type: string, enum: [ok, low, stopped] }
        canSpend: { type: boolean }
        stoppedBy: { type: string, enum: [suspended, out_of_credit, spend_cap], nullable: true }
        mode: { type: string, enum: [prepaid, postpaid] }
        balanceUsd: { type: string, example: '18.40', description: 'A postpaid balance runs below zero until its invoice.' }
        periodStart: { type: string, format: date-time, description: 'The billing month the cap is measured over (India time).' }
        periodSpendUsd: { type: string }
        monthlySpendLimitUsd: { type: string, nullable: true }
        headroomUsd: { type: string, nullable: true, description: 'What can still be spent before Telenow stops the account; null for postpaid with no cap.' }
        lowThresholdUsd: { type: string, nullable: true }
    BillingSummary:
      type: object
      description: The Billing page's data, loosely typed here; `spendState` is the part integrations build on.
      additionalProperties: true
      properties:
        account: { type: object, additionalProperties: true }
        billedToParent: { type: boolean }
        periodStart: { type: string, format: date-time }
        payableUsd: { type: string }
        spendState: { allOf: [{ $ref: '#/components/schemas/SpendState' }], nullable: true }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        entryType: { type: string, example: charge, description: 'charge | payment | adjustment | promo' }
        amountUsd: { type: string, description: 'Signed: charges negative, payments and credits positive.' }
        balanceAfterUsd: { type: string, nullable: true, description: "null when read with a sub-account's key." }
        refKind: { type: string, nullable: true, description: 'What it settles: session, rental (number rent), number_setup, invoice, manual, …' }
        refId: { type: string, nullable: true }
        fxCurrency: { type: string, nullable: true }
        fxRate: { type: string, nullable: true }
        fxAmount: { type: string, nullable: true }
        note: { type: string, nullable: true }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        sourceOrgId: { type: string, format: uuid, nullable: true, description: "The sub-account that caused it, in a parent's ledger." }
    LedgerPage:
      type: object
      description: 'Page mode: entries, total, limit, offset. Feed mode: entries, nextCursor, limit.'
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        nextCursor: { type: string, description: 'Feed mode: send it back as cursor.' }
    SubAccountLimits:
      type: object
      description: 'Each field - null = no limit, 0 = stopped. In a create/update, an absent field is unchanged (create - no limit).'
      additionalProperties: false
      properties:
        maxConcurrentCalls: { type: integer, minimum: 0, nullable: true }
        monthlySpendLimitUsd: { type: number, minimum: 0, nullable: true }
        totalSpendLimitUsd: { type: number, minimum: 0, nullable: true }
    SubAccount:
      type: object
      properties:
        id: { type: string, format: uuid, description: "The sub-account's organization id." }
        name: { type: string }
        externalId: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended, closed] }
        limits: { $ref: '#/components/schemas/SubAccountLimits' }
        suspendedAt: { type: string, format: date-time, nullable: true }
        suspendedReason: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        usage:
          type: object
          properties:
            monthToDateSpendUsd: { type: number }
            activeCalls: { type: integer }
    SubAccountKey:
      type: object
      description: The minted key. `key` is the secret and is returned exactly once.
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: 'vai_live_…' }
        lastFour: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, developer, viewer] }
        createdAt: { type: string, format: date-time }
    CreateSubAccountRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 160 }
        externalId: { type: string, maxLength: 200, description: "Your id for this customer; unique among your OPEN sub-accounts (a closed one frees it)." }
        limits: { $ref: '#/components/schemas/SubAccountLimits' }
        keyName: { type: string, maxLength: 120, default: Sub-account key }
        keyRole: { type: string, enum: [admin, developer, viewer], default: admin }
    UpdateSubAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 160 }
        externalId: { type: string, maxLength: 200, nullable: true }
        limits: { $ref: '#/components/schemas/SubAccountLimits' }
    SubAccountUsage:
      type: object
      properties:
        subAccountId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        calls: { type: integer, description: Calls that started in the window. }
        billableSeconds: { type: integer }
        spendUsd: { type: number, description: Charged in the window. }
        activeCalls: { type: integer }
        monthToDateSpendUsd: { type: number }
        totalSpendUsd: { type: number }
        limits: { $ref: '#/components/schemas/SubAccountLimits' }
        status: { type: string, enum: [active, suspended, closed] }
    Connector:
      type: object
      description: A connector, and the exact fields a connection to it takes.
      required: [providerId, name, category, blurb, authKind, docsUrl, connect, capabilities]
      properties:
        providerId: { type: string, example: shopify }
        name: { type: string, example: Shopify }
        category: { type: string, example: commerce }
        blurb: { type: string }
        authKind: { type: string, example: api_key, description: '`api_key` (send credentials), `oauth2` (authorize after create), `builtin`, …' }
        docsUrl: { type: string, nullable: true }
        connect:
          type: object
          required: [credentials, settings]
          properties:
            credentials: { type: array, items: { $ref: '#/components/schemas/ConnectorField' }, description: 'Goes in `credentials` (secret ones are never returned).' }
            settings: { type: array, items: { $ref: '#/components/schemas/ConnectorField' }, description: 'Goes in `settings`.' }
        capabilities:
          type: array
          description: What an agent can do through a connection to it.
          items:
            type: object
            required: [capability, name, description]
            properties:
              capability: { type: string, example: whatsapp.send }
              name: { type: string }
              description: { type: string }
    ConnectorField:
      type: object
      required: [key, label, required]
      properties:
        key: { type: string, example: api_token }
        label: { type: string }
        required: { type: boolean }
        secret: { type: boolean, description: 'Encrypted at rest and returned only as a mask.' }
        kind: { type: string, description: 'A field filled by a dashboard flow of its own (e.g. `whatsapp_session`).' }
        placeholder: { type: string }
        help: { type: string }
    Connection:
      type: object
      description: A connection, secrets masked (`••••••••`).
      required: [id, providerId, providerName, authKind, label, credentials, settings, status, lastError, lastUsedAt, createdAt, capabilities]
      properties:
        id: { type: string, format: uuid }
        providerId: { type: string }
        providerName: { type: string }
        authKind: { type: string }
        label: { type: string }
        credentials: { type: object, additionalProperties: { type: string }, description: 'Secret values read as the mask; send the mask back to keep one.' }
        settings: { type: object, additionalProperties: true }
        status: { type: string, enum: [active, error, disconnected], description: '`disconnected` — an OAuth connection until consent lands.' }
        lastError: { type: string, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        capabilities: { type: array, items: { type: string } }
    ConnectionVerification:
      type: object
      description: What the connector's verification call found.
      required: [ok, warnings]
      properties:
        ok: { type: boolean }
        error: { type: string, description: 'When not ok.' }
        warnings: { type: array, items: { type: string } }
    ConnectionRequest:
      type: object
      description: >
        `credentials` and `settings` are provider-shaped - read the field lists
        from GET /api/v1/integrations/providers/{providerId}. Unknown keys are
        dropped rather than stored.
      properties:
        providerId:
          type: string
          example: shopify
          description: Required on create. On update it may only repeat the current provider.
        label:
          type: string
          example: Acme Store
          description: Display name. Defaults to the connector's own name.
        credentials:
          type: object
          additionalProperties: { type: string }
          example: { api_token: shpat_xxxxxxxxxxxx }
          description: >
            Secret-flagged values are encrypted at rest and never returned. On
            UPDATE, sending the mask back keeps the stored secret; on CREATE the
            mask is refused, because there is nothing stored to keep.
        settings:
          type: object
          additionalProperties: true
          example: { store_domain: acme.myshopify.com }
          description: Non-secret connect values.
        verify:
          type: boolean
          default: true
          description: >
            Check the credentials against the vendor before returning. Skipped
            for OAuth connectors, which hold no tokens until consent lands.
    Envelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }
    CallCompletedEvent:
      description: >-
        The `call.completed` webhook body - exactly ONE per finished call, whatever the
        outcome (answered, no-answer, busy, failed, a dial refused before it rang, a call the
        platform closed). Also carries orgId, occurredAt, identifier and, on a sub-account's
        event, subAccountId, like every session-scoped event.
      type: object
      properties:
        event: { type: string, enum: [call.completed] }
        sessionId: { type: string, format: uuid }
        agentId: { type: string, format: uuid, nullable: true }
        orgId: { type: string, format: uuid }
        subAccountId: { type: string, format: uuid, description: Present only on a sub-account's event }
        identifier: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        outcome: { type: string, enum: [answered, no-answer, busy, failed], description: The carrier's verdict; never null }
        disposition: { type: string, nullable: true, description: Raw carrier disposition; null when no carrier reported one }
        status: { type: string, enum: [ended, orphaned] }
        endReason: { type: string, nullable: true, description: Open set - match defensively }
        answeredBy: { type: string, nullable: true, description: 'AMD verdict: human, machine*, amd_unconfirmed, ...' }
        direction: { type: string, enum: [inbound, outbound, web, whatsapp, instagram] }
        channel: { type: string }
        callSid: { type: string, nullable: true }
        fromNumber: { type: string, nullable: true }
        toNumber: { type: string, nullable: true }
        durationSecs: { type: integer, nullable: true }
        billableSecs: { type: integer, nullable: true, description: Seconds the carrier billed; null when none reported }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time, nullable: true }
        variables: { type: object, nullable: true, additionalProperties: true, description: The call's variables, as given. }
        analysis: { type: object, nullable: true, description: Present only if post-call analysis already finished }
        callRecord: { allOf: [{ $ref: '#/components/schemas/CallRecord' }], description: Present only when the agent kept a call record }
        campaignId: { type: string, format: uuid, nullable: true }
        campaignTargetId: { type: string, format: uuid, nullable: true }
        attempt: { type: integer, nullable: true, description: This target's dial number, 1 for the first }
    Hook:
      type: object
      required: [id, target_url, events, agent_id, include_recording, include_transcript, source, created_at]
      properties:
        id: { type: string, format: uuid }
        target_url: { type: string, format: uri }
        events:
          type: array
          items: { type: string, example: call.ended }
        agent_id: { type: string, format: uuid, nullable: true }
        include_recording: { type: boolean }
        include_transcript: { type: boolean }
        source: { type: string, example: zapier }
        created_at: { type: string, format: date-time }
    HookCreated:
      description: >-
        The create response. Identical to Hook plus the HMAC signing secret,
        which is returned ONLY at creation (never in the list endpoint). Persist
        it to verify the X-VoiceAI-Signature (sha256=<hex>) on delivered events.
      allOf:
        - $ref: '#/components/schemas/Hook'
        - type: object
          required: [signing_secret, secret]
          properties:
            signing_secret: { type: string, description: 'HMAC-SHA256 key for X-VoiceAI-Signature verification' }
            secret: { type: string, description: 'Alias of signing_secret' }
    CreateHookRequest:
      type: object
      required: [target_url]
      properties:
        target_url: { type: string, format: uri, description: 'HTTPS receiver URL' }
        event: { type: string, description: 'Single event name (alternative to the events array)' }
        events:
          type: array
          items: { type: string }
          description: >-
            21 valid names, or "*" for all (no events subscribes to all). Session-scoped (carry sessionId/agentId):
            call.started, call.ended, call.completed, call.machine_detected, call.dtmf,
            transcript.ready, tool.invoked, recording.ready, call.analyzed.
            Org-scoped (NO agentId — an agent-scoped hook never receives these):
            whatsapp.message.received, whatsapp.message.status,
            whatsapp.account.health, billing.invoice_issued,
            billing.payment_overdue, billing.account_suspended,
            billing.number_renewal_due, billing.number_renewed,
            billing.number_renewal_failed, billing.number_release_pending,
            billing.number_released_nonpayment, billing.spend_state_changed.
            An unknown name is rejected 400 with the full valid list.
        agent_id: { type: string, format: uuid, description: Scope to one agent (omit = org-wide) }
        include_recording: { type: boolean, default: false }
        include_transcript: { type: boolean, default: false }
        source: { type: string, description: 'Platform label: zapier | make | n8n | viasocket | …' }
    ChatRequest:
      type: object
      required: [agentId, identifier, input]
      properties:
        agentId: { type: string, format: uuid, description: 'Must belong to your org and be active.' }
        identifier:
          type: string
          maxLength: 128
          example: user-42
          description: 'Your stable end-user id (1–128 chars). Binds the session.'
        input: { type: string, example: 'Hello!', description: "The user's message." }
        sessionId:
          type: string
          format: uuid
          description: 'Omit on the first turn; send the returned id on follow-ups.'
        variables:
          type: object
          additionalProperties: { type: string }
          description: 'Context variables — first message of a session only.'
    ChatReply:
      type: object
      required: [sessionId, reply, turn, identifier]
      properties:
        sessionId: { type: string, format: uuid }
        reply: { type: string, description: "The agent's full reply (tool calls resolved)." }
        turn: { type: integer, description: 'User turns this session has seen (1-based).' }
        identifier: { type: string }
    ChatMessage:
      type: object
      required: [role, content, createdAt]
      properties:
        role: { type: string, example: assistant }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    ChatTranscript:
      type: object
      required: [sessionId, messages]
      properties:
        sessionId: { type: string, format: uuid }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
    ClientTokenRequest:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string, format: uuid, description: 'An agent of your organization (unknown: 404).' }
        ttlSeconds: { type: integer, default: 600, example: 600, description: 'Clamped to 30–3600 (not an error).' }
        maxCalls: { type: integer, default: 1, example: 1, description: 'Calls the token may start; clamped to 1–100.' }
        variables: { type: object, additionalProperties: { type: string } }
        callerIdentity:
          type: object
          properties:
            number: { type: string }
            identifier: { type: string }
            channel: { type: string }
    ClientToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
    InitiateCallRequest:
      type: object
      required: [agentId, mobileNumber]
      properties:
        agentId: { type: string }
        mobileNumber: { type: string, example: '+15551234567' }
        variables: { type: object, additionalProperties: { type: string } }
        identifier: { type: string }
        firstResponse:
          type: string
          description: >
            Override the agent's opening line for this call. Honored on the
            queued path too — stored per number and replayed on every attempt.
        machineDetection:
          type: string
          enum: ['true', 'hangup']
          description: >
            Answering-machine detection. `true` stays on and leaves the agent's
            voicemail message; `hangup` drops the call the moment a machine
            answers. Omitting it is NOT "off" — the agent's own voicemail
            message / Call Screen / IVR Hangup settings arm detection by
            themselves. Plivo, Twilio, Vobiz and Vonage; inert on Exotel and SIP.
        fromNumber:
          type: string
          example: '+15551234567'
          description: >
            Caller ID, as the number itself. Matched against your org's own live
            numbers — never passed to the carrier — so it is not a spoofing
            vector. Omit to use the agent's default. Send this or `fromNumberId`,
            not both.
        fromNumberId:
          type: string
          format: uuid
          description: The same choice by row id, from `GET /api/v1/numbers`.
        queue:
          type: boolean
          description: >
            Park the dial instead of placing it now. The number is enqueued into
            a managed per-agent queue that a worker drains at your org's
            concurrency, so a burst past the cap QUEUES (202) instead of being
            refused (429). Numbers already live in the queue are deduped.
            Changes the response shape — see the 202 below.
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: 'Queue mode only. Total dial attempts incl. the first.'
        retryBackoffSecs:
          type: integer
          minimum: 5
          maximum: 3600
          default: 300
          description: >
            Queue mode only. Base backoff between attempts; grown exponentially
            by the worker, capped at 1h.
        retryOnNoAnswer:
          type: boolean
          default: true
          description: >
            Queue mode only. Redial an unanswered/busy call. Hard failures always
            retry until `maxAttempts`.
        callType: { type: string }
        userId: { type: string, format: uuid }
    CallResult:
      type: object
      required: [sessionId, callId, status, callStatus, phoneNumber]
      properties:
        sessionId: { type: string }
        callId: { type: string, description: The carrier's call id. }
        status: { type: string, example: active }
        callStatus: { type: string, description: What the carrier said when it took the dial. }
        phoneNumber: { type: string, description: The number dialled, as sent. }
    QueuedCallResult:
      type: object
      description: >
        Returned with `202` when `queue: true`. There is no live session yet, so
        no `sessionId` — the worker dials later.
      properties:
        success: { type: boolean }
        queued: { type: boolean, example: true }
        campaignId:
          type: string
          format: uuid
          description: The managed queue this number joined.
        deduplicated:
          type: boolean
          description: >
            True when the number was ALREADY live in this queue, so nothing new
            was added. A number is held unique while pending/dialing. The queue is
            per agent and dial policy: the same number with another policy is a new
            entry in another queue (another campaignId).
        pendingAhead:
          type: integer
          description: Queue depth after this call.
    SessionInfo:
      type: object
      required: [sessionId, websocketUrl, status]
      properties:
        sessionId: { type: string }
        websocketUrl: { type: string, example: 'wss://api.telenow.ai/ws/web-agent' }
        status: { type: string }
        transport: { type: string, example: websocket, description: 'Agent mode: how the client joins (`websocket`). Not on a widget session.' }
        embedSnippet: { type: string, description: 'Agent-mode only: ready-to-paste WebAgentWidget embed script.' }
        # Manual/softphone mode (mode: "manual") additionally returns:
        callId: { type: string, description: 'Carrier call id (manual mode).' }
        callMode: { type: string, example: manual, description: '"manual" for softphone bridges.' }
        fromNumber: { type: string, description: 'Resolved caller-ID (manual mode).' }
        toNumber: { type: string, description: 'Dialed destination (manual mode).' }
    Agent:
      type: object
      description: Agent config (loosely typed here; see the product docs for the full shape).
      additionalProperties: true
      properties:
        name: { type: string }
        systemPrompt: { type: string }
        llmProvider: { type: string }
        llmModel: { type: string }
        sttProvider: { type: string }
        ttsProvider: { type: string }
        ttsVoice: { type: string }
    AgentRecord:
      type: object
      description: >-
        An agent as stored. Keys are snake_case and always present. Provider keys inside the
        `*_config` objects come masked, unless an owner or admin key asks with `view=edit`.
      required: [id, user_id, org_id, name, description, system_prompt, is_active, is_public, llm_provider, llm_model, llm_config, stt_provider, stt_config, tts_provider, tts_voice, tts_config, s2s_config, fallback_config, telephony_provider, telephony_config, session_config, total_sessions, total_messages, total_duration, tags, metadata, created_at, updated_at, deleted_at, partner_client_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: "Who created it (for an agent made with a key, the key's creator)." }
        org_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        system_prompt: { type: string, nullable: true }
        is_active: { type: boolean }
        is_public: { type: boolean }
        llm_provider: { type: string }
        llm_model: { type: string }
        llm_config: { type: object, additionalProperties: true, nullable: true }
        stt_provider: { type: string }
        stt_config: { type: object, additionalProperties: true, nullable: true }
        tts_provider: { type: string }
        tts_voice: { type: string }
        tts_config: { type: object, additionalProperties: true, nullable: true }
        s2s_config: { type: object, additionalProperties: true, nullable: true }
        fallback_config: { type: object, additionalProperties: true, nullable: true }
        telephony_provider: { type: string, nullable: true }
        telephony_config: { type: object, additionalProperties: true, nullable: true }
        session_config: { type: object, additionalProperties: true }
        total_sessions: { type: integer }
        total_messages: { type: integer }
        total_duration: { type: integer, description: Seconds. }
        tags: { nullable: true, description: 'As saved.' }
        metadata: { type: object, additionalProperties: true, nullable: true, description: 'The flow graph (`flow`), languages, logo key and other builder settings.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        partner_client_id: { type: string, format: uuid, nullable: true }
    AgentStats:
      type: object
      required: [totalSessions, totalMessages, totalDuration, avgSessionDuration, avgMessagesPerSession, avgServerMs, avgSttMs, avgLlmMs, avgTtsMs, avgNetRttMs, avgFlowMs, latencySamples]
      properties:
        totalSessions: { type: integer }
        totalMessages: { type: integer }
        totalDuration: { type: integer, description: Seconds. }
        avgSessionDuration: { type: number }
        avgMessagesPerSession: { type: number }
        avgServerMs: { type: integer, nullable: true }
        avgSttMs: { type: integer, nullable: true }
        avgLlmMs: { type: integer, nullable: true }
        avgTtsMs: { type: integer, nullable: true }
        avgNetRttMs: { type: integer, nullable: true }
        avgFlowMs: { type: integer, nullable: true }
        latencySamples: { type: integer }
    AgentVersion:
      type: object
      required: [version, note, createdAt, name, llmModel, ttsVoice, savedByEmail]
      properties:
        version: { type: integer }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        name: { type: string, nullable: true }
        llmModel: { type: string, nullable: true }
        ttsVoice: { type: string, nullable: true }
        savedByEmail: { type: string, nullable: true }
    AgentVersionPerf:
      type: object
      required: [calls, avgDurationSec, avgRespMs, avgSttMs, avgLlmMs, avgTtsMs, answeredRate, avgScore, sentimentPositive, sentimentNeutral, sentimentNegative, totalChargeUsd, fromTs, toTs]
      properties:
        calls: { type: integer }
        avgDurationSec: { type: number, nullable: true }
        avgRespMs: { type: number, nullable: true }
        avgSttMs: { type: number, nullable: true }
        avgLlmMs: { type: number, nullable: true }
        avgTtsMs: { type: number, nullable: true }
        answeredRate: { type: number, nullable: true }
        avgScore: { type: number, nullable: true }
        sentimentPositive: { type: integer }
        sentimentNeutral: { type: integer }
        sentimentNegative: { type: integer }
        totalChargeUsd: { type: number }
        fromTs: { type: string, format: date-time }
        toTs: { type: string, format: date-time }
    AgentAnalytics:
      type: object
      required: [total, avgScore, hallucinationCalls, positive, neutral, negative, agentWords, customerWords, sentimentTrend, dispositionBreakdown, topObjections, topTopics, topKeywords]
      properties:
        total: { type: integer }
        avgScore: { type: number, nullable: true }
        hallucinationCalls: { type: integer }
        positive: { type: integer }
        neutral: { type: integer }
        negative: { type: integer }
        agentWords: { type: integer }
        customerWords: { type: integer }
        sentimentTrend:
          type: array
          items:
            type: object
            required: [day, positive, neutral, negative]
            properties:
              day: { type: string, format: date }
              positive: { type: integer }
              neutral: { type: integer }
              negative: { type: integer }
        dispositionBreakdown:
          type: array
          items:
            type: object
            required: [disposition, count]
            properties:
              disposition: { type: string, description: '"(none)" for calls with no disposition.' }
              count: { type: integer }
        topObjections:
          type: array
          maxItems: 15
          items:
            type: object
            required: [objection, count]
            properties:
              objection: { type: string }
              count: { type: integer }
        topTopics: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/TagCount' } }
        topKeywords: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/TagCount' } }
    TagCount:
      type: object
      required: [tag, count]
      properties:
        tag: { type: string }
        count: { type: integer }
    CallerMemory:
      type: object
      required: [orgId, callerKey, summary, facts, callCount, lastSession, updatedAt, expiresAt]
      properties:
        orgId: { type: string, format: uuid }
        callerKey: { type: string }
        summary: { type: string, nullable: true }
        facts: { description: 'What the agents learned (as extracted), usually an object.' }
        callCount: { type: integer }
        lastSession: { type: string, format: uuid, nullable: true }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true, description: 'Listed even when past; it is removed on the next sweep.' }
    PreflightReport:
      type: object
      required: [component, provider, keySource, status]
      properties:
        component: { type: string, enum: [stt, tts, llm] }
        provider: { type: string }
        keySource: { type: string, enum: [byok, platform] }
        status: { type: string, enum: [ok, failed, skipped] }
        attribution: { type: string, enum: [customer_account, customer_config, provider_outage, platform, unknown], description: 'Whose problem a failure is.' }
        error: { type: string }
        advice: { type: string }
    ModelCheck:
      type: object
      required: [ok, reason, checkedAt, cached]
      properties:
        ok: { type: boolean }
        reason: { type: string, nullable: true }
        checkedAt: { type: string, format: date-time }
        cached: { type: boolean }
    PromptFinding:
      type: object
      required: [field, code, line, column, message]
      properties:
        field: { type: string, enum: [prompt, greeting] }
        code: { type: string }
        line: { type: integer }
        column: { type: integer }
        message: { type: string }
    AgentKnowledgeBase:
      type: object
      required: [id, org_id, name, description, embedding_model, created_by, app_id, app_kb_key, created_at, updated_at, deleted_at, document_count, partner_client_id, document_ids]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        embedding_model: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
        app_id: { type: string, nullable: true }
        app_kb_key: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        document_count: { type: integer, nullable: true }
        partner_client_id: { type: string, format: uuid, nullable: true }
        document_ids: { type: array, items: { type: string, format: uuid }, nullable: true, description: 'The documents the agent is limited to; null = the whole base.' }
    CallChannel:
      type: string
      enum: [telephony, web_call, web_chat, whatsapp, instagram, chat, softphone, simulation]
    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    CallRowBase:
      type: object
      description: >-
        The fields every call row carries, in the call log and on /api/v1 (`CallRow`, `CallV1`). A call as the call log lists it. Keys are snake_case and always present. `lead`, `source`,
        `caller_memory` and `variables` read null once the call's content is purged
        (`content_purged_at`).
      required: [id, org_id, agent_id, agent_name, user_id, initiated_by, initiated_by_name, initiated_via, initiated_by_email, initiated_by_api_key, status, call_mode, channel, direction, from_number, to_number, phone_number, call_sid, start_time, end_time, duration_sec, answered_by, disposition, wrapup_disposition, resp_ms_avg, resp_ms_max, resp_samples, agent_audible_count, audio_gap_count, stt_ms_avg, turn_hold_ms_avg, llm_ms_avg, tts_ms_avg, net_rtt_ms_avg, flow_ms_avg, recording_id, lead, source, caller_memory, variables, created_at, content_purged_at, updated_at, charge_usd, artifacts]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid, nullable: true }
        agent_id: { type: string, format: uuid }
        agent_name: { type: string, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        initiated_by: { type: string, format: uuid, nullable: true, description: 'The member who started it (for a key, its creator).' }
        initiated_by_name: { type: string, nullable: true }
        initiated_via: { type: string, enum: [user, api], nullable: true }
        initiated_by_email: { type: string, nullable: true }
        initiated_by_api_key: { type: string, format: uuid, nullable: true }
        status: { type: string, description: 'active, inactive, ended, …' }
        call_mode: { type: string }
        channel: { $ref: '#/components/schemas/CallChannel' }
        direction: { type: string, enum: [web, whatsapp, instagram, inbound, outbound] }
        from_number: { type: string, nullable: true }
        to_number: { type: string, nullable: true }
        phone_number: { type: string, nullable: true }
        call_sid: { type: string, nullable: true }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time, nullable: true }
        duration_sec: { type: integer, nullable: true }
        answered_by: { type: string, nullable: true }
        disposition: { type: string, nullable: true }
        wrapup_disposition: { type: string, nullable: true }
        resp_ms_avg: { type: integer, nullable: true }
        resp_ms_max: { type: integer, nullable: true }
        resp_samples: { type: integer, nullable: true }
        agent_audible_count: { type: integer, nullable: true }
        audio_gap_count: { type: integer, nullable: true }
        stt_ms_avg: { type: integer, nullable: true }
        turn_hold_ms_avg: { type: integer, nullable: true }
        llm_ms_avg: { type: integer, nullable: true }
        tts_ms_avg: { type: integer, nullable: true }
        net_rtt_ms_avg: { type: integer, nullable: true }
        flow_ms_avg: { type: integer, nullable: true }
        recording_id: { type: string, format: uuid, nullable: true, description: 'The latest recording.' }
        lead: { nullable: true, description: 'The lead the call was made for, as given.' }
        source: { type: string, nullable: true }
        caller_memory: { nullable: true, description: 'What the agent remembered about the caller.' }
        variables: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }
        content_purged_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        charge_usd: { type: string, nullable: true, example: '0.42', description: 'What the call was charged (decimal string); null until settled.' }
        artifacts:
          type: object
          required: [analysis, cost, latency, recording, trace]
          properties:
            analysis: { type: boolean }
            cost: { type: boolean }
            latency: { type: boolean }
            recording: { type: boolean }
            trace: { type: boolean }
    CallRow:
      description: A call as the call log lists it (`CallRowBase` plus the objectives as stored).
      allOf:
        - { $ref: '#/components/schemas/CallRowBase' }
        - type: object
          required: [objectives_state]
          properties:
            objectives_state: { nullable: true, description: "The call's objectives as the agent left them." }
    CallRecord:
      type: object
      description: >-
        What the agent recorded on the call — the objectives it kept. `disposition` is the agent's own
        rule over what the call established (null when no rule matched), not a carrier outcome.
      required: [disposition, established, seeded, declined, actionsDone, optedOut]
      properties:
        disposition: { type: string, nullable: true }
        established: { type: object, additionalProperties: true }
        seeded: { type: array, items: { type: string } }
        declined: { type: array, items: { type: string } }
        actionsDone: { type: array, items: { type: string } }
        optedOut: { type: boolean }
    CallV1:
      description: >-
        A call as /api/v1 returns it — the call log's row without `objectives_state`, and in its place
        `callRecord`, present only when the agent kept a call record (absent, not null, otherwise).
      allOf:
        - { $ref: '#/components/schemas/CallRowBase' }
        - type: object
          properties:
            callRecord: { $ref: '#/components/schemas/CallRecord' }
    CallV1Detail:
      allOf:
        - { $ref: '#/components/schemas/CallV1' }
        - type: object
          required: [transcript, participants]
          properties:
            transcript: { type: array, items: { $ref: '#/components/schemas/TranscriptTurn' } }
            participants: { type: object, additionalProperties: { type: string }, description: 'Agent id → name, for the agents on the call.' }
    TranscriptTurn:
      type: object
      description: One turn of a call's transcript (system messages left out).
      required: [role, text, at, agent_id]
      properties:
        role: { type: string }
        text: { type: string }
        at: { type: string, format: date-time }
        agent_id: { type: string, nullable: true, description: 'Which agent spoke, on a call handed between agents.' }
    CallDetail:
      allOf:
        - { $ref: '#/components/schemas/CallRow' }
        - type: object
          required: [transcript, participants, llm_prompt_tokens, llm_completion_tokens, llm_total_tokens, llm_cached_tokens, recordings, post_call, stack, completeness]
          properties:
            transcript: { type: array, items: { $ref: '#/components/schemas/TranscriptTurn' } }
            participants: { type: object, additionalProperties: { type: string }, description: 'Agent id → name, for the agents on the call.' }
            llm_prompt_tokens: { type: integer }
            llm_completion_tokens: { type: integer }
            llm_total_tokens: { type: integer }
            llm_cached_tokens: { type: integer }
            recordings:
              type: array
              items:
                type: object
                required: [id, channel, duration_sec, created_at, source]
                properties:
                  id: { type: string, format: uuid }
                  channel: { type: string }
                  duration_sec: { type: integer, nullable: true }
                  created_at: { type: string, format: date-time }
                  source: { type: string, nullable: true, description: '`transfer_bridge` for the recording after a transfer.' }
            post_call: { type: array, items: { $ref: '#/components/schemas/PostCallEvent' } }
            stack:
              type: array
              items:
                type: object
                required: [kind, provider, model, voice, route]
                properties:
                  kind: { type: string, enum: [llm, stt, tts] }
                  provider: { type: string }
                  model: { type: string, nullable: true }
                  voice: { type: string, nullable: true }
                  route:
                    type: object
                    nullable: true
                    required: [label, tierServed, tierRequested, region]
                    properties:
                      label: { type: string }
                      tierServed: { type: string, nullable: true }
                      tierRequested: { type: string, nullable: true }
                      region: { type: string, nullable: true }
            failureCause: { type: string, description: 'Only for a failed, busy or unanswered call the carrier explained.' }
            voiceStackIncidents:
              type: array
              maxItems: 10
              items:
                type: object
                required: [component, provider, keySource, attribution, error, createdAt]
                properties:
                  component: { type: string }
                  provider: { type: string }
                  keySource: { type: string }
                  attribution: { type: string }
                  error: { type: string }
                  createdAt: { type: string, format: date-time }
            completeness:
              type: object
              required: [recording, metrics, transcript, analysis]
              properties:
                recording: { $ref: '#/components/schemas/Completeness' }
                metrics: { $ref: '#/components/schemas/Completeness' }
                transcript: { $ref: '#/components/schemas/Completeness' }
                analysis: { $ref: '#/components/schemas/Completeness' }
            data_gaps:
              type: array
              description: 'Only when something is missing.'
              items: { type: string, enum: [recording_missing, telemetry_missing, transcript_missing, analysis_missing, answered_no_media] }
    Completeness:
      type: string
      enum: [present, missing, pending, not_applicable]
    PostCallEvent:
      type: object
      description: 'One thing the post-call plane did for the call; which keys it has depends on `type`.'
      required: [type]
      properties:
        type: { type: string, enum: [post_call.analysis, destination.write, app.event, post_call.email, post_call.whatsapp] }
        at: { type: string, nullable: true }
        status: { type: string }
        model: { type: string, nullable: true }
        error: { type: string, nullable: true }
        destination: { type: string }
        app: { type: string }
        topic: { type: string }
        route: { type: string, nullable: true }
        attempts: { type: integer }
        next_attempt_at: { type: string, nullable: true }
    CallCharge:
      type: object
      description: What one call was charged, by component (decimal strings, USD).
      required: [sessionId, orgId, callType, llmUsd, sttUsd, ttsUsd, telephonyUsd, platformAiUsd, postCallAnalysisUsd, simulationUsd, embeddingUsd, platformFeeUsd, totalChargeUsd, hasEstimates, breakdown, ratedAt]
      properties:
        sessionId: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        callType: { type: string }
        llmUsd: { type: string }
        sttUsd: { type: string }
        ttsUsd: { type: string }
        telephonyUsd: { type: string }
        platformAiUsd: { type: string }
        postCallAnalysisUsd: { type: string }
        simulationUsd: { type: string }
        embeddingUsd: { type: string }
        platformFeeUsd: { type: string }
        totalChargeUsd: { type: string }
        hasEstimates: { type: boolean, description: 'Some component was priced from an estimate.' }
        breakdown: { type: object, additionalProperties: true, description: 'The rated events (`events`) and the fee rule applied.' }
        ratedAt: { type: string, format: date-time }
    CallComment:
      type: object
      required: [id, session_id, created_by, body, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid, nullable: true }
        body: { type: string }
        created_at: { type: string, format: date-time }
    CallFollowup:
      type: object
      required: [id, session_id, created_by, body, due_date, status, completed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid, nullable: true }
        body: { type: string }
        due_date: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [open, done] }
        completed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CallInsights:
      type: object
      required: [sessionId, orgId, sentiment, sentimentScore, summary, topics, keywords, agentWords, customerWords, agentTurns, customerTurns, model, createdAt, updatedAt]
      properties:
        sessionId: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        sentiment: { type: string, enum: [positive, neutral, negative], nullable: true }
        sentimentScore: { type: number, minimum: -1, maximum: 1, nullable: true }
        summary: { type: string, nullable: true }
        topics: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string } }
        agentWords: { type: integer }
        customerWords: { type: integer }
        agentTurns: { type: integer }
        customerTurns: { type: integer }
        model: { type: string, nullable: true, description: '"provider/model"; null when only the counts were filled.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LiveTicketAnswer:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [ticket, wsUrl]
          properties:
            ticket: { type: string, description: 'Single use, 30 s.' }
            wsUrl: { type: string, description: 'The WebSocket to open (the ticket is in it).' }
    Recording:
      type: object
      description: A stored recording. Keys are snake_case and always present.
      required: [id, org_id, session_id, agent_id, channel, storage_kind, storage_path, mime, sample_rate, duration_sec, size_bytes, metadata, created_at, deleted_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid, nullable: true }
        agent_id: { type: string, format: uuid, nullable: true }
        channel: { type: string }
        storage_kind: { type: string, description: 'Where the bytes live (local_fs, s3, …).' }
        storage_path: { type: string, description: 'Internal; download with downloadRecording.' }
        mime: { type: string }
        sample_rate: { type: integer, nullable: true }
        duration_sec: { type: integer, nullable: true }
        size_bytes: { type: integer, nullable: true }
        metadata: { nullable: true, description: 'e.g. source (server_fallback, transfer_bridge).' }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    InboundRouting:
      type: object
      required: [orgId, url, timeoutMs, enabled, signingSecret, signingSecretHint, lastOkAt, lastError, lastErrorAt, createdAt, updatedAt]
      properties:
        orgId: { type: string, format: uuid }
        url: { type: string }
        timeoutMs: { type: integer }
        enabled: { type: boolean }
        signingSecret: { type: string, nullable: true, description: 'In full only on the answer that made it.' }
        signingSecretHint: { type: string, description: 'The last 4 characters, after "…".' }
        lastOkAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        lastErrorAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CarrierCall:
      type: object
      required: [callUuid, fromLast4, callerKeyHash, initiatedAt, answeredAt, endedAt, durationSecs, billDurationSecs, ringDurationSecs, hangupCause, hangupCauseCode, hangupSource, callState, telenowSession]
      properties:
        callUuid: { type: string, nullable: true }
        fromLast4: { type: string, nullable: true }
        callerKeyHash: { type: string, nullable: true, description: "SHA-256 (hex) of the caller's last 10 digits." }
        initiatedAt: { type: string, format: date-time, nullable: true }
        answeredAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        durationSecs: { type: integer, nullable: true }
        billDurationSecs: { type: integer, nullable: true }
        ringDurationSecs: { type: integer, nullable: true }
        hangupCause: { type: string, nullable: true }
        hangupCauseCode: { type: integer, nullable: true }
        hangupSource: { type: string, nullable: true }
        callState: { type: string, nullable: true }
        telenowSession:
          type: object
          nullable: true
          required: [id, status, disposition]
          properties:
            id: { type: string, format: uuid }
            status: { type: string }
            disposition: { type: string, nullable: true }
    DncEntry:
      type: object
      description: A do-not-call entry (snake_case keys).
      required: [id, org_id, phone_number, reason, source, created_by, created_at, session_id, call_content_available]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        phone_number: { type: string }
        reason: { type: string, nullable: true }
        source: { type: string, description: 'manual, csv, opt_out (the caller asked), client, …' }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        session_id: { type: string, format: uuid, nullable: true, description: 'The call where it was asked for.' }
        call_content_available: { type: boolean, nullable: true, description: "Whether that call's recording / transcript still exist (null on the add answer)." }
    DncChange:
      type: object
      description: A change-feed row — an entry as it is now, or a deletion (`deleted` true, the rest null).
      required: [id, org_id, phone_number, reason, source, created_by, created_at, session_id, updated_at, deleted, deleted_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        phone_number: { type: string }
        reason: { type: string, nullable: true }
        source: { type: string, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        session_id: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }
        deleted: { type: boolean }
        deleted_at: { type: string, format: date-time, nullable: true }
    ConsentRecord:
      type: object
      description: One recorded consent (snake_case keys).
      required: [id, org_id, phone_number, consent_type, scope, source, evidence, disclosure_text, disclosure_version, captured_at, expires_at, revoked_at, revoke_source, revoke_note, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        phone_number: { type: string }
        consent_type: { type: string }
        scope: { type: string }
        source: { type: string }
        evidence:
          type: object
          additionalProperties: true
          properties:
            server:
              type: object
              properties:
                recordedVia: { type: string }
                recordedByUser: { type: string, format: uuid }
                apiKeyId: { type: string, format: uuid, nullable: true }
                peer: { type: string, nullable: true }
                forwardedFor: { type: string, nullable: true }
                userAgent: { type: string, nullable: true }
        disclosure_text: { type: string, nullable: true }
        disclosure_version: { type: string, nullable: true }
        captured_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoke_source: { type: string, nullable: true }
        revoke_note: { type: string, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    PhoneNumber:
      type: object
      description: A phone number the org holds (or held). Keys are snake_case and always present; prices are in the carrier's currency.
      required: [id, user_id, org_id, provider, source, e164, country_iso, region, number_type, monthly_rent, setup_price, capabilities, external_id, provider_integration_id, compliance_external_id, provider_data, agent_id, is_active, metadata, released_at, created_at, updated_at, next_renewal_at, renewal_alert_at, is_default_outbound, inbound_action, is_pool, pool_max_concurrent]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid, nullable: true }
        provider: { type: string }
        source: { type: string, description: 'purchased, byoc (your own carrier account), trunk.' }
        e164: { type: string }
        country_iso: { type: string, nullable: true }
        region: { type: string, nullable: true }
        number_type: { type: string, nullable: true }
        monthly_rent: { type: string, nullable: true }
        setup_price: { type: string, nullable: true }
        capabilities: { type: object, additionalProperties: true, nullable: true }
        external_id: { type: string, nullable: true }
        provider_integration_id: { type: string, nullable: true }
        compliance_external_id: { type: string, nullable: true }
        provider_data: { nullable: true, description: "The carrier's own record." }
        agent_id: { type: string, format: uuid, nullable: true }
        is_active: { type: boolean }
        metadata: { nullable: true }
        released_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        next_renewal_at: { type: string, format: date-time, nullable: true }
        renewal_alert_at: { type: string, format: date-time, nullable: true }
        is_default_outbound: { type: boolean }
        inbound_action: { type: string, nullable: true }
        is_pool: { type: boolean }
        pool_max_concurrent: { type: integer, nullable: true }
    PricedPhoneNumber:
      allOf:
        - { $ref: '#/components/schemas/PhoneNumber' }
        - { $ref: '#/components/schemas/UsdPrice' }
    UsdPrice:
      type: object
      required: [price_currency, monthly_rent_usd, setup_price_usd]
      properties:
        price_currency: { type: string, enum: [USD, INR, EUR] }
        monthly_rent_usd: { type: string, nullable: true }
        setup_price_usd: { type: string, nullable: true }
    AvailableNumber:
      allOf:
        - type: object
          required: [e164, country, region, number_type, monthly_rent, setup_price, capabilities, raw]
          properties:
            e164: { type: string }
            country: { type: string, nullable: true }
            region: { type: string, nullable: true }
            number_type: { type: string, nullable: true }
            monthly_rent: { type: string, nullable: true }
            setup_price: { type: string, nullable: true }
            capabilities:
              type: object
              properties:
                voice: { type: boolean, nullable: true }
                sms: { type: boolean, nullable: true }
                mms: { type: boolean, nullable: true }
            raw: { description: "The carrier's own listing." }
        - { $ref: '#/components/schemas/UsdPrice' }
    ComplianceApplication:
      type: object
      required: [id, user_id, org_id, provider, external_id, status, rejection_reason, country_iso, number_type, end_user_type, alias, end_user, documents_summary, callback_url, last_callback_at, last_callback_payload, metadata, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid, nullable: true }
        provider: { type: string }
        external_id: { type: string }
        status: { type: string, description: "The carrier's status (accepted when it can be linked)." }
        rejection_reason: { type: string, nullable: true }
        country_iso: { type: string }
        number_type: { type: string }
        end_user_type: { type: string }
        alias: { type: string }
        end_user: { type: object, additionalProperties: true }
        documents_summary: { nullable: true }
        callback_url: { type: string, nullable: true }
        last_callback_at: { type: string, format: date-time, nullable: true }
        last_callback_payload: { nullable: true }
        metadata: { nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReclaimOutcome:
      type: object
      description: '`status` restored or requested; the other keys depend on it.'
      required: [status]
      properties:
        status: { type: string, enum: [restored, requested] }
        number: { $ref: '#/components/schemas/PhoneNumber' }
        restore:
          type: object
          properties:
            agentRestored: { type: boolean }
            defaultOutboundRestored: { type: boolean }
            poolRestored: { type: boolean }
            inboundActionRestored: { type: boolean }
            campaignsRelinked: { type: integer }
            notes: { type: array, items: { type: string } }
        chargedUsd: { type: string }
        requestedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        carrierSaid: { type: string, nullable: true }
        alreadyRequested: { type: boolean }
    Campaign:
      type: object
      description: A campaign (snake_case keys, always present).
      required: [id, org_id, agent_id, name, status, concurrency, start_time_local, end_time_local, timezone, machine_detection, max_attempts, retry_backoff_secs, retry_on_no_answer, total_targets, completed_targets, failed_targets, created_by, created_at, updated_at, started_at, completed_at, app_meta, from_number_id, queue_key, partner_client_id]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, running, paused, completed, cancelled, queued] }
        concurrency: { type: integer }
        start_time_local: { type: string, nullable: true, example: '09:00' }
        end_time_local: { type: string, nullable: true, example: '18:00' }
        timezone: { type: string }
        machine_detection: { type: string, nullable: true, enum: ['true', hangup] }
        max_attempts: { type: integer }
        retry_backoff_secs: { type: integer }
        retry_on_no_answer: { type: boolean }
